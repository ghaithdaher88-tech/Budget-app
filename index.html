<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BudgetPro">

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Cairo',sans-serif;background:#0a0a0f;color:#f0f0ff;min-height:100vh;}
input,select,button,textarea{font-family:inherit;}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:rgba(124,58,237,0.4);border-radius:99px;}
.fade{animation:fadeIn 0.25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.card{background:#1a1a27;border:1px solid #2a2a3d;border-radius:20px;padding:20px;}
.btn{border:none;border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer;color:#fff;font-size:13px;transition:opacity 0.2s;}
.btn:active{opacity:0.7;}
.inp{width:100%;background:#13131a;border:1px solid #2a2a3d;border-radius:12px;padding:11px 14px;color:#f0f0ff;font-size:14px;outline:none;}
.inp:focus{border-color:#7c3aed;}
label.lbl{font-size:11px;color:#8888aa;display:block;margin-bottom:6px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;}
.tab-active{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;}
.tab-inactive{background:transparent;color:#8888aa;}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#7c3aed;color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;font-weight:700;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,0.4);}
.progress-bar{height:8px;background:#2a2a3d;border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;border-radius:99px;transition:width 0.5s ease;}
.row{display:flex;align-items:center;justify-content:space-between;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.kpi{border-radius:18px;padding:14px 10px;text-align:center;}
.tag{font-size:10px;padding:2px 8px;border-radius:6px;font-weight:700;}
@media print{.no-print{display:none!important}.print-only{display:block!important}}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ============ STATE ============
const DEFAULT_CONFIG = {

  fixed: [
    {id:1,name:"Fahrkarte ÖPNV",amount:88},
    {id:2,name:"Internet",amount:25},
    {id:3,name:"KFZ-Versicherung",amount:81},
    {id:4,name:"Strom",amount:70},
    {id:5,name:"Ratenzahlung",amount:95},
  ],

    {id:11,name:"تعبئة وقود",budget:120,color:"#3b82f6",icon:"⛽"},
    {id:12,name:"مصاريف أخرى",budget:261,color:"#8b5cf6",icon:"💳"},
    {id:13,name:"طوارئ",budget:87,color:"#ef4444",icon:"🚨"},
    {id:14,name:"توفير",budget:123,color:"#10b981",icon:"💰"},
  ],
};

const MONTHS = {

  en:["January","February","March","April","May","June","July","August","September","October","November","December"],
  de:["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"],
};

const LABELS = {
  ar:{dir:"rtl",font:"'Cairo',sans-serif",appName:"BudgetPro",salary:"الراتب",fixed:"ثابت",spent:"منفق",remaining:"متبقي",addExpense:"إضافة مصروف",desc:"الوصف",amount:"المبلغ €",category:"الفئة",date:"التاريخ",save:"حفظ",cancel:"إلغاء",edit:"تعديل",delete:"حذف",add:"إضافة",noExpenses:"لا توجد مصاريف",dashboard:"الرئيسية",addTab:"إضافة",history:"السجل",accounting:"محاسبة",report:"تقرير",settings:"إعدادات",fixedExp:"مصاريف ثابتة",varBudgets:"ميزانية متغيرة",total:"الإجمالي",language:"اللغة",theme:"المظهر",monthSalary:"الراتب الشهري",fixedCats:"المصاريف الثابتة",varCats:"فئات الإنفاق",addFixed:"إضافة بند ثابت",addVar:"إضافة فئة",namePh:"الاسم",exportExcel:"تصدير Excel",exportDATEV:"تصدير DATEV",journalEntries:"قيود يومية",balanceSheet:"ميزانية عمومية",assets:"الأصول",liabilities:"الخصوم",analysis:"تحليل ذكي",generateReport:"إنشاء التقرير",analyzing:"جاري التحليل...",gmailReport:"تقرير Gmail",gmailSend:"إرسال",currentMonth:"الشهر الحالي",overBy:"تجاوز",leftOf:"متبقي",health:"الصحة المالية",savingsRate:"نسبة الادخار",debit:"مدين",credit:"دائن",descPh:"مثال: Rewe",autoSaved:"محفوظ ✓",ops:"عملية"},
  en:{dir:"ltr",font:"'Inter',sans-serif",appName:"BudgetPro",salary:"Salary",fixed:"Fixed",spent:"Spent",remaining:"Remaining",addExpense:"Add Expense",desc:"Description",amount:"Amount €",category:"Category",date:"Date",save:"Save",cancel:"Cancel",edit:"Edit",delete:"Delete",add:"Add",noExpenses:"No expenses this month",dashboard:"Dashboard",addTab:"Add",history:"History",accounting:"Accounting",report:"Report",settings:"Settings",fixedExp:"Fixed Expenses",varBudgets:"Variable Budgets",total:"Total",language:"Language",theme:"Theme",monthSalary:"Monthly Salary",fixedCats:"Fixed Expenses",varCats:"Variable Categories",addFixed:"Add Fixed Item",addVar:"Add Category",namePh:"Name",exportExcel:"Export Excel",exportDATEV:"Export DATEV",journalEntries:"Journal Entries",balanceSheet:"Balance Sheet",assets:"Assets",liabilities:"Liabilities",analysis:"AI Analysis",generateReport:"Generate Report",analyzing:"Analyzing...",gmailReport:"Gmail Report",gmailSend:"Send",currentMonth:"Current Month",overBy:"Over by",leftOf:"Remaining",health:"Financial Health",savingsRate:"Savings Rate",debit:"Debit (Soll)",credit:"Credit (Haben)",descPh:"e.g. Rewe",autoSaved:"Saved ✓",ops:"transactions"},
  de:{dir:"ltr",font:"'Inter',sans-serif",appName:"BudgetPro",salary:"Gehalt",fixed:"Fix",spent:"Ausgaben",remaining:"Verbleibend",addExpense:"Ausgabe hinzufügen",desc:"Beschreibung",amount:"Betrag €",category:"Kategorie",date:"Datum",save:"Speichern",cancel:"Abbrechen",edit:"Bearbeiten",delete:"Löschen",add:"Hinzufügen",noExpenses:"Keine Ausgaben diesen Monat",dashboard:"Übersicht",addTab:"Hinzufügen",history:"Verlauf",accounting:"Buchhaltung",report:"Bericht",settings:"Einstellungen",fixedExp:"Fixkosten",varBudgets:"Variable Budgets",total:"Gesamt",language:"Sprache",theme:"Design",monthSalary:"Monatsgehalt",fixedCats:"Fixkosten",varCats:"Variable Kategorien",addFixed:"Fixkosten hinzufügen",addVar:"Kategorie hinzufügen",namePh:"Name",exportExcel:"Excel exportieren",exportDATEV:"DATEV exportieren",journalEntries:"Buchungssätze",balanceSheet:"Bilanz",assets:"Aktiva",liabilities:"Passiva",analysis:"KI-Analyse",generateReport:"Bericht erstellen",analyzing:"Analysiere...",gmailReport:"Gmail Bericht",gmailSend:"Senden",currentMonth:"Aktueller Monat",overBy:"Überschritten",leftOf:"Verbleibend",health:"Finanzgesundheit",savingsRate:"Sparquote",debit:"Soll",credit:"Haben",descPh:"z.B. Rewe",autoSaved:"Gespeichert ✓",ops:"Buchungen"},
};

const THEMES = {
  dark:{bg:"#0a0a0f",surface:"#13131a",card:"#1a1a27",border:"#2a2a3d",text:"#f0f0ff",sub:"#8888aa",accent:"#7c3aed"},
  light:{bg:"#f0f0f8",surface:"#ffffff",card:"#f5f5ff",border:"#e0e0f0",text:"#1a1a2e",sub:"#6666aa",accent:"#6d28d9"},
  midnight:{bg:"#050510",surface:"#0d0d20",card:"#12122a",border:"#1e1e3a",text:"#e0e0ff",sub:"#7777bb",accent:"#818cf8"},
  forest:{bg:"#030f08",surface:"#071a0e",card:"#0c2415",border:"#154025",text:"#e0ffe8",sub:"#66bb88",accent:"#10b981"},
  rose:{bg:"#0f080a",surface:"#1a0e10",card:"#251318",border:"#3d1e23",text:"#ffe0e5",sub:"#bb7788",accent:"#f43f5e"},
  ocean:{bg:"#030c18",surface:"#071525",card:"#0c1e32",border:"#153048",text:"#e0f0ff",sub:"#6699cc",accent:"#0ea5e9"},
};

const ICONS=["🛒","⛽","💳","🚨","💰","🏠","🎓","🍔","💊","✈️","👕","📱","🎮","🐾","🧾","🏥","📚","🎵","🏋️","🐕"];
const COLORS=["#f59e0b","#3b82f6","#8b5cf6","#ef4444","#10b981","#ec4899","#06b6d4","#f97316","#84cc16","#6366f1"];
const ACCOUNT_MAP={"طعام ومشتريات":"6300","تعبئة وقود":"6320","مصاريف أخرى":"6800","طوارئ":"6900","توفير":"9000","default":"6800"};

let state = {
  lang: lsGet("bl","ar"),
  theme: lsGet("bt","dark"),
  config: lsGet("bc", DEFAULT_CONFIG),
  allData: lsGet("bd", {}),
  selectedMonth: getMonthKey(new Date()),
  activeTab: "dashboard",
  showMonthPicker: false,
  form: {desc:"",amount:"",category:"",date:new Date().toISOString().split("T")[0]},
  formError: "",
  editIncome: false,
  incomeInput: 0,
  newFixed: {name:"",amount:""},
  newVar: {name:"",budget:"",icon:"💳",color:"#8b5cf6"},
  editingFixed: null,
  editingVar: null,
  reportText: "",
  reportLoading: false,
  gmailStatus: "",
  saveFlash: false,
  toastMsg: "",
};
state.incomeInput = state.config.income;
state.form.category = state.config.variable[0]?.name || "";

function lsGet(k,fb){try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch{return fb;}}
function lsw(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
function getMonthKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;}
function getMonthLabel(k){const[y,m]=k.split("-");return `${MONTHS[state.lang][parseInt(m)-1]} ${y}`;}
function t(){return LABELS[state.lang];}
function th(){return THEMES[state.theme];}

function setState(updates){
  Object.assign(state,updates);
  render();
}

function notify(msg){
  setState({toastMsg:msg});
  setTimeout(()=>setState({toastMsg:""}),2500);
}

function persistConfig(c){
  setState({config:c});
  lsw("bc",c);
  notify("✓ "+t().save);
}

function persistData(d){
  setState({allData:d,saveFlash:true});
  lsw("bd",d);
  setTimeout(()=>setState({saveFlash:false}),2000);
}

function expenses(){return state.allData[state.selectedMonth]||[];}
function totalFixed(){return state.config.fixed.reduce((s,i)=>s+i.amount,0);}
function totalVarBudget(){return state.config.variable.reduce((s,i)=>s+i.budget,0);}
function totalSpent(){return expenses().reduce((s,e)=>s+e.amount,0);}
function remaining(){return totalVarBudget()-totalSpent();}
function spent(cat){return expenses().filter(e=>e.category===cat).reduce((s,e)=>s+e.amount,0);}
function allMonths(){
  const keys=[...new Set([...Object.keys(state.allData).filter(k=>(state.allData[k]||[]).length>0),getMonthKey(new Date())])];
  return keys.sort((a,b)=>b.localeCompare(a));
}

function addExpense(){
  if(!state.form.desc.trim()){setState({formError:t().desc+" ?"});return;}
  if(!state.form.amount||isNaN(state.form.amount)||Number(state.form.amount)<=0){setState({formError:t().amount+" ?"});return;}
  const updated={...state.allData,[state.selectedMonth]:[{id:Date.now(),...state.form,amount:Number(state.form.amount)},...(state.allData[state.selectedMonth]||[])]};
  persistData(updated);
  setState({form:{desc:"",amount:"",category:state.config.variable[0]?.name||"",date:new Date().toISOString().split("T")[0]},formError:"",activeTab:"dashboard"});
  notify("✓ "+t().addExpense);
}

function deleteExpense(id){
  persistData({...state.allData,[state.selectedMonth]:expenses().filter(e=>e.id!==id)});
}

function exportExcel(){
  const wb=XLSX.utils.book_new();
  const entries=expenses().map(e=>({...e,soll:ACCOUNT_MAP[e.category]||ACCOUNT_MAP["default"],haben:"1200"}));
  const ws1=XLSX.utils.aoa_to_sheet([[t().date,t().desc,t().category,t().debit,t().credit,t().amount],...entries.map(e=>[e.date,e.desc,e.category,e.soll,e.haben,e.amount.toFixed(2)])]);
  ws1["!cols"]=[{wch:12},{wch:30},{wch:20},{wch:10},{wch:10},{wch:12}];
  XLSX.utils.book_append_sheet(wb,ws1,t().journalEntries);
  const ws2=XLSX.utils.aoa_to_sheet([[t().assets,"",t().liabilities,""],[t().salary,"",t().fixedExp,""],[state.config.income+"€","",totalFixed()+"€",""],[t().varBudgets,"",t().spent,""],[totalVarBudget()+"€","",totalSpent().toFixed(2)+"€",""]]);
  XLSX.utils.book_append_sheet(wb,ws2,t().balanceSheet);
  XLSX.writeFile(wb,`BudgetPro_${getMonthLabel(state.selectedMonth).replace(" ","_")}.xlsx`);
  notify("✓ Excel!");
}

function exportDATEV(){
  const entries=expenses().map(e=>({...e,soll:ACCOUNT_MAP[e.category]||ACCOUNT_MAP["default"],haben:"1200"}));
  const header=`"Umsatz";"Soll/Haben";"WKZ Umsatz";"Konto";"Gegenkonto";"Belegdatum";"Buchungstext"`;
  const rows=entries.map(e=>`"${e.amount.toFixed(2)}";"S";"EUR";"${e.soll}";"${e.haben}";"${e.date.split("-").reverse().join("")}";"${e.desc}"`);
  const blob=new Blob(["\uFEFF"+header+"\n"+rows.join("\n")],{type:"text/csv;charset=utf-8;"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`DATEV_${getMonthLabel(state.selectedMonth).replace(" ","_")}.csv`;a.click();
  notify("✓ DATEV CSV!");
}

async function generateReport(){
  setState({reportLoading:true,reportText:""});
  const rows=state.config.variable.map(v=>`${v.name}: ${v.budget}€ / ${spent(v.name).toFixed(2)}€`).join(", ");
  const exps=expenses().slice(0,15).map(e=>`${e.date}: ${e.desc} ${e.amount}€`).join(", ");
  const prompts={ar:`أنت مستشار مالي. اكتب تقرير ميزانية شهري احترافي بالعربية لشهر ${getMonthLabel(state.selectedMonth)}. الراتب: ${state.config.income}€ | الثابت: ${totalFixed()}€ | المنفق: ${totalSpent().toFixed(2)}€ | المتبقي: ${remaining().toFixed(2)}€. البنود: ${rows}. اكتب: ١-ملخص ٢-تحليل الإنفاق ٣-نصائح للشهر القادم`,en:`Financial advisor. Write professional monthly budget report in English for ${getMonthLabel(state.selectedMonth)}. Income: ${state.config.income}€ | Fixed: ${totalFixed()}€ | Spent: ${totalSpent().toFixed(2)}€ | Remaining: ${remaining().toFixed(2)}€. Categories: ${rows}. Write: 1-Summary 2-Analysis 3-Tips for next month`,de:`Finanzberater. Schreiben Sie Monatsbericht auf Deutsch für ${getMonthLabel(state.selectedMonth)}. Gehalt: ${state.config.income}€ | Fix: ${totalFixed()}€ | Ausgaben: ${totalSpent().toFixed(2)}€ | Verbleibend: ${remaining().toFixed(2)}€. Kategorien: ${rows}. Schreiben Sie: 1-Übersicht 2-Analyse 3-Tipps`};
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:prompts[state.lang]}]})});
    const data=await res.json();
    setState({reportText:data.content?.map(i=>i.text||"").join("")||"Error",reportLoading:false});
  }catch{setState({reportText:"Error. Try again.",reportLoading:false});}
}

async function sendGmail(){
  setState({gmailStatus:"loading"});
  const body=`BudgetPro - ${getMonthLabel(state.selectedMonth)}\n${t().salary}: ${state.config.income}€ | ${t().fixed}: ${totalFixed()}€ | ${t().spent}: ${totalSpent().toFixed(2)}€ | ${t().remaining}: ${remaining().toFixed(2)}€\n\n${state.config.variable.map(v=>`• ${v.name}: ${v.budget}€ / ${spent(v.name).toFixed(2)}€ ${spent(v.name)>v.budget?"⚠":"✓"}`).join("\n")}\n\n${expenses().slice(0,20).map(e=>`• ${e.date} | ${e.desc} | ${e.amount}€`).join("\n")}`;
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:200,mcp_servers:[{type:"url",url:"https://gmailmcp.googleapis.com/mcp/v1",name:"gmail"}],messages:[{role:"user",content:`Create Gmail draft: subject="BudgetPro - ${getMonthLabel(state.selectedMonth)}", body="${body}". Reply: SUCCESS or FAILED`}]})});
    const data=await res.json();
    const text=data.content?.find(b=>b.type==="text")?.text||"";
    setState({gmailStatus:text.toLowerCase().includes("success")?"success":"error"});
  }catch{setState({gmailStatus:"error"});}
  setTimeout(()=>setState({gmailStatus:""}),4000);
}

// ============ RENDER ============
function el(tag,attrs,children){
  const e=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object")Object.assign(e.style,v);
    else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="className")e.className=v;
    else e.setAttribute(k,v);
  });
  if(children){
    (Array.isArray(children)?children:[children]).forEach(c=>{
      if(c===null||c===undefined)return;
      e.appendChild(typeof c==="string"?document.createTextNode(c):c);
    });
  }
  return e;
}

function div(style,children){return el("div",{style},children);}
function span(style,text){return el("span",{style},text);}
function p(style,text){return el("p",{style},text);}
function h(n,style,text){return el(`h${n}`,{style},text);}
function btn(text,style,onClick){return el("button",{className:"btn",style,onClick},text);}
function inp(attrs){return el("input",{className:"inp",...attrs});}

function renderApp(){
  const L=t(), TH=th();
  document.body.style.background=TH.bg;
  document.body.style.color=TH.text;
  document.body.style.direction=L.dir;
  document.body.style.fontFamily=L.font;

  const app=div({minHeight:"100vh",background:TH.bg,color:TH.text});

  // TOAST
  if(state.toastMsg){
    const toast=div({position:"fixed",top:"16px",left:"50%",transform:"translateX(-50%)",background:TH.accent,color:"#fff",padding:"10px 20px",borderRadius:"99px",fontSize:"13px",fontWeight:"700",zIndex:"999",boxShadow:"0 4px 20px rgba(0,0,0,0.4)",whiteSpace:"nowrap"},state.toastMsg);
    app.appendChild(toast);
  }

  // HEADER
  const header=div({background:TH.surface,borderBottom:`1px solid ${TH.border}`,padding:"14px 18px",position:"sticky",top:"0",zIndex:"50"});
  const hRow=div({display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"12px"});
  const hLeft=div({display:"flex",alignItems:"center",gap:"12px"});
  hLeft.appendChild(div({width:"38px",height:"38px",borderRadius:"12px",background:"linear-gradient(135deg,#7c3aed,#2563eb)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"20px",flexShrink:"0"},"💎"));
  const hTitle=div({});
  hTitle.appendChild(el("h1",{style:{margin:"0",fontSize:"18px",fontWeight:"900",background:"linear-gradient(90deg,#a78bfa,#60a5fa)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}},"BudgetPro"));
  hTitle.appendChild(p({margin:"0",fontSize:"10px",color:TH.sub},state.saveFlash?L.autoSaved:"Smart Budget Manager"));
  hLeft.appendChild(hTitle);
  const salBox=div({background:"rgba(16,185,129,0.1)",border:"1px solid rgba(16,185,129,0.3)",borderRadius:"12px",padding:"6px 14px",textAlign:"center"});
  salBox.appendChild(p({margin:"0",fontSize:"9px",color:"#6ee7b7",textTransform:"uppercase",letterSpacing:"1px"},L.salary));
  salBox.appendChild(p({margin:"0",fontSize:"20px",fontWeight:"900",color:"#10b981"},`${state.config.income}€`));
  hRow.appendChild(hLeft);hRow.appendChild(salBox);
  header.appendChild(hRow);

  // Month Picker
  const monthWrap=div({position:"relative"});
  const monthBtn=el("button",{style:{width:"100%",background:`rgba(124,58,237,0.1)`,border:`1px solid rgba(124,58,237,0.3)`,borderRadius:"12px",padding:"10px 16px",color:"#c4b5fd",fontSize:"14px",fontWeight:"700",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between"},onClick:()=>setState({showMonthPicker:!state.showMonthPicker})});
  monthBtn.appendChild(span({},"📅 "+getMonthLabel(state.selectedMonth)));
  const mRight=div({display:"flex",alignItems:"center",gap:"8px"});
  if(state.selectedMonth===getMonthKey(new Date()))mRight.appendChild(span({fontSize:"10px",background:"rgba(16,185,129,0.2)",color:"#10b981",padding:"2px 8px",borderRadius:"99px"},L.currentMonth));
  mRight.appendChild(span({color:"#7c3aed"},"▾"));
  monthBtn.appendChild(mRight);
  monthWrap.appendChild(monthBtn);
  if(state.showMonthPicker){
    const picker=div({position:"absolute",top:"110%",[L.dir==="rtl"?"right":"left"]:"0",[L.dir==="rtl"?"left":"right"]:"0",background:TH.surface,border:`1px solid ${TH.border}`,borderRadius:"14px",zIndex:"100",overflow:"hidden",boxShadow:"0 16px 48px rgba(0,0,0,0.5)"});
    allMonths().forEach(k=>{
      const mb=el("button",{style:{width:"100%",padding:"12px 18px",background:k===state.selectedMonth?"rgba(124,58,237,0.2)":"transparent",border:"none",borderBottom:`1px solid ${TH.border}`,color:k===state.selectedMonth?"#c4b5fd":TH.sub,fontSize:"14px",cursor:"pointer",textAlign:L.dir==="rtl"?"right":"left"},onClick:()=>setState({selectedMonth:k,showMonthPicker:false})},getMonthLabel(k));
      picker.appendChild(mb);
    });
    monthWrap.appendChild(picker);
  }
  header.appendChild(monthWrap);
  app.appendChild(header);

  // TABS
  const tabs=["dashboard","add","history","accounting","report","settings"];
  const tabLabels={dashboard:L.dashboard,add:L.addTab,history:L.history,accounting:L.accounting,report:L.report,settings:L.settings};
  const tabIcons={dashboard:"⬡",add:"＋",history:"≡",accounting:"∑",report:"◈",settings:"⚙"};
  const tabBar=div({padding:"12px 18px 0",maxWidth:"680px",margin:"0 auto"});
  const tabRow=div({display:"flex",gap:"4px",background:TH.surface,border:`1px solid ${TH.border}`,borderRadius:"18px",padding:"5px"});
  tabs.forEach(tab=>{
    const active=state.activeTab===tab;
    const tb=el("button",{style:{flex:"1",padding:"8px 2px",borderRadius:"13px",border:"none",cursor:"pointer",transition:"all 0.2s",background:active?"linear-gradient(135deg,#7c3aed,#2563eb)":"transparent",color:active?"#fff":TH.sub,fontFamily:L.font},onClick:()=>setState({activeTab:tab})});
    tb.appendChild(div({fontSize:"16px",marginBottom:"2px",textAlign:"center"},tabIcons[tab]));
    tb.appendChild(div({fontSize:"9px",textAlign:"center",opacity:"0.9"},tabLabels[tab]));
    tabRow.appendChild(tb);
  });
  tabBar.appendChild(tabRow);
  app.appendChild(tabBar);

  // CONTENT
  const content=div({maxWidth:"680px",margin:"0 auto",padding:"16px 18px 60px"});
  content.className="fade";

  if(state.activeTab==="dashboard") renderDashboard(content,L,TH);
  else if(state.activeTab==="add") renderAdd(content,L,TH);
  else if(state.activeTab==="history") renderHistory(content,L,TH);
  else if(state.activeTab==="accounting") renderAccounting(content,L,TH);
  else if(state.activeTab==="report") renderReport(content,L,TH);
  else if(state.activeTab==="settings") renderSettings(content,L,TH);

  app.appendChild(content);
  return app;
}

function card(children,extra={}){
  const c=div({background:THEMES[state.theme].card,border:`1px solid ${THEMES[state.theme].border}`,borderRadius:"20px",padding:"18px",...extra});
  (Array.isArray(children)?children:[children]).forEach(ch=>{if(ch)c.appendChild(ch);});
  return c;
}

  } else {
    sCard.appendChild(div({fontSize:"13px",lineHeight:"1.9",color:TH.text,whiteSpace:"pre-wrap",background:TH.surface,borderRadius:"12px",padding:"14px"},state.reportText));
  }
  content.appendChild(sCard);
}

function renderSettings(content,L,TH){
  content.appendChild(h(3,{margin:"0 0 16px",fontSize:"15px",fontWeight:"800"},"⚙️ "+L.settings));

  // Language
  const lCard=card([h(4,{margin:"0 0 14px",fontSize:"13px",fontWeight:"800",color:"#60a5fa"},"🌐 "+L.language)]);
  const lg=div({display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"8px"});
  [["ar","العربية","🇸🇦"],["en","English","🇬🇧"],["de","Deutsch","🇩🇪"]].forEach(([code,label,flag])=>{
    const active=state.lang===code;
    const b=el("button",{style:{padding:"14px 8px",borderRadius:"14px",border:`2px solid ${active?"#7c3aed":TH.border}`,background:active?"rgba(124,58,237,0.15)":TH.surface,color:TH.text,cursor:"pointer",transition:"all 0.2s",fontFamily:L.font},onClick:()=>{lsw("bl",code);setState({lang:code});}});
    b.appendChild(div({fontSize:"24px",textAlign:"center",marginBottom:"4px"},flag));
    b.appendChild(div({fontSize:"11px",fontWeight:"700",textAlign:"center"},label));
    if(active)b.appendChild(div({fontSize:"8px",color:"#7c3aed",textAlign:"center",marginTop:"2px"},"✓ Active"));
    lg.appendChild(b);
  });
  lCard.appendChild(lg);content.appendChild(lCard);

  // Theme
  const tCard=card([h(4,{margin:"0 0 14px",fontSize:"13px",fontWeight:"800",color:"#60a5fa"},"🎨 "+L.theme)]);
  const tg=div({display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"8px"});
  const themeNames={dark:{ar:"داكن",en:"Dark",de:"Dunkel"},light:{ar:"فاتح",en:"Light",de:"Hell"},midnight:{ar:"منتصف الليل",en:"Midnight",de:"Mitternacht"},forest:{ar:"غابة",en:"Forest",de:"Wald"},rose:{ar:"وردي",en:"Rose",de:"Rosa"},ocean:{ar:"محيط",en:"Ocean",de:"Ozean"}};
  Object.entries(THEMES).forEach(([key,th2])=>{
    const active=state.theme===key;
    const b=el("button",{style:{padding:"14px 8px",borderRadius:"14px",border:`2px solid ${active?"#7c3aed":"transparent"}`,background:th2.bg,cursor:"pointer",position:"relative",minHeight:"60px"},onClick:()=>{lsw("bt",key);setState({theme:key});}});
    const dot=div({width:"20px",height:"20px",borderRadius:"50%",background:th2.accent,margin:"0 auto 6px"});
    b.appendChild(dot);
    b.appendChild(div({fontSize:"10px",color:th2.text,fontWeight:"700",textAlign:"center",fontFamily:L.font},(themeNames[key]||{})[state.lang]||themeNames[key].en));
    if(active){const dot2=div({position:"absolute",top:"4px",right:"4px",width:"8px",height:"8px",borderRadius:"50%",background:"#7c3aed"});b.appendChild(dot2);}
    tg.appendChild(b);
  });
  tCard.appendChild(tg);content.appendChild(tCard);

  // Income
  const iCard=card([]);
  const iTop=div({display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:state.editIncome?"14px":"0"});
  iTop.appendChild(h(4,{margin:"0",fontSize:"13px",fontWeight:"800",color:"#fbbf24"},"💵 "+L.monthSalary));
  iTop.appendChild(btn(state.editIncome?L.cancel:L.edit,{background:state.editIncome?"rgba(239,68,68,0.15)":"rgba(251,191,36,0.15)",color:state.editIncome?"#fca5a5":"#fbbf24",border:`1px solid ${state.editIncome?"rgba(239,68,68,0.3)":"rgba(251,191,36,0.3)"}`,padding:"7px 14px",fontSize:"12px"},()=>setState({editIncome:!state.editIncome})));
  iCard.appendChild(iTop);
  if(state.editIncome){
    const iRow=div({display:"flex",gap:"8px"});
    const ii=inp({type:"number",value:state.incomeInput});
    ii.addEventListener("input",e=>state.incomeInput=e.target.value);
    iRow.appendChild(ii);
    iRow.appendChild(btn(L.save,{background:"linear-gradient(135deg,#7c3aed,#2563eb)",padding:"11px 18px",fontSize:"13px"},()=>{persistConfig({...state.config,income:Number(state.incomeInput)});setState({editIncome:false});}));
    iCard.appendChild(iRow);
  } else {
    iCard.appendChild(p({margin:"10px 0 0",fontSize:"24px",fontWeight:"900",color:"#10b981"},`${state.config.income}€`));
  }
  content.appendChild(iCard);

  // Fixed Items
  const fCard=card([h(4,{margin:"0 0 14px",fontSize:"13px",fontWeight:"800",color:"#fbbf24"},"📌 "+L.fixedCats)]);
  state.config.fixed.forEach(f=>{
    if(state.editingFixed?.id===f.id){
      const row=div({display:"flex",gap:"6px",alignItems:"center",background:TH.surface,borderRadius:"12px",padding:"8px",marginBottom:"8px"});
      const ni=inp({value:state.editingFixed.name,style:{flex:"2",padding:"8px 12px"}});
      ni.addEventListener("input",e=>state.editingFixed.name=e.target.value);
      const ai=inp({type:"number",value:state.editingFixed.amount,style:{flex:"1",padding:"8px 12px"}});
      ai.addEventListener("input",e=>state.editingFixed.amount=e.target.value);
      row.appendChild(ni);row.appendChild(ai);
      row.appendChild(btn("✓",{background:"linear-gradient(135deg,#10b981,#059669)",padding:"8px 12px"},()=>{persistConfig({...state.config,fixed:state.config.fixed.map(x=>x.id===state.editingFixed.id?{...x,name:state.editingFixed.name,amount:Number(state.editingFixed.amount)}:x)});setState({editingFixed:null});}));
      row.appendChild(btn("✕",{background:"rgba(239,68,68,0.2)",color:"#fca5a5",border:"1px solid rgba(239,68,68,0.3)",padding:"8px 10px"},()=>setState({editingFixed:null})));
      fCard.appendChild(row);
    } else {
      const row=div({display:"flex",justifyContent:"space-between",alignItems:"center",background:TH.surface,borderRadius:"12px",padding:"10px 14px",marginBottom:"8px"});
      row.appendChild(div({display:"flex",alignItems:"center",gap:"10px"},[div({width:"8px",height:"8px",borderRadius:"50%",background:"#f59e0b",flexShrink:"0"}),span({fontSize:"13px"},`${f.name} `),span({color:"#fbbf24",fontWeight:"700"},`(${f.amount}€)`)]));
      const btns3=div({display:"flex",gap:"6px"});
      btns3.appendChild(btn("✏",{background:"rgba(124,58,237,0.15)",color:"#c4b5fd",border:"1px solid rgba(124,58,237,0.3)",padding:"4px 10px",fontSize:"12px"},()=>setState({editingFixed:{...f}})));
      btns3.appendChild(btn("🗑",{background:"rgba(239,68,68,0.15)",color:"#fca5a5",border:"1px solid rgba(239,68,68,0.3)",padding:"4px 10px",fontSize:"12px"},()=>persistConfig({...state.config,fixed:state.config.fixed.filter(x=>x.id!==f.id)})));
      row.appendChild(btns3);fCard.appendChild(row);
    }
  });
  const addFRow=div({borderTop:`1px solid ${TH.border}`,paddingTop:"14px",marginTop:"6px"});
  addFRow.appendChild(el("label",{className:"lbl"},L.addFixed));
  const afRow=div({display:"flex",gap:"8px",marginTop:"8px"});
  const afn=inp({placeholder:L.namePh,value:state.newFixed.name,style:{flex:"2"}});
  afn.addEventListener("input",e=>state.newFixed.name=e.target.value);
  const afa=inp({type:"number",placeholder:"€",value:state.newFixed.amount,style:{flex:"1"}});
  afa.addEventListener("input",e=>state.newFixed.amount=e.target.value);
  afRow.appendChild(afn);afRow.appendChild(afa);
  afRow.appendChild(btn(L.add,{background:"linear-gradient(135deg,#7c3aed,#2563eb)",padding:"11px 14px",fontSize:"13px"},()=>{
    if(!state.newFixed.name.trim()||!state.newFixed.amount)return;
    persistConfig({...state.config,fixed:[...state.config.fixed,{id:Date.now(),name:state.newFixed.name.trim(),amount:Number(state.newFixed.amount)}]});
    setState({newFixed:{name:"",amount:""}});
  }));
  addFRow.appendChild(afRow);fCard.appendChild(addFRow);content.appendChild(fCard);

  // Variable Items
  const vCard=card([h(4,{margin:"0 0 14px",fontSize:"13px",fontWeight:"800",color:"#c4b5fd"},"📂 "+L.varCats)]);
  state.config.variable.forEach(v=>{
    if(state.editingVar?.id===v.id){
      const wrap=div({background:TH.surface,borderRadius:"14px",padding:"14px",marginBottom:"10px"});
      const r1=div({display:"flex",gap:"8px",marginBottom:"10px"});
      const vn=inp({value:state.editingVar.name,style:{flex:"2"}});vn.addEventListener("input",e=>state.editingVar.name=e.target.value);
      const vb=inp({type:"number",value:state.editingVar.budget,style:{flex:"1"}});vb.addEventListener("input",e=>state.editingVar.budget=e.target.value);
      r1.appendChild(vn);r1.appendChild(vb);wrap.appendChild(r1);
      const iRow=div({display:"flex",flexWrap:"wrap",gap:"6px",marginBottom:"10px"});
      ICONS.forEach(ic=>{const ib=el("button",{style:{background:state.editingVar.icon===ic?"rgba(124,58,237,0.4)":"rgba(255,255,255,0.05)",border:state.editingVar.icon===ic?"2px solid #7c3aed":"2px solid transparent",borderRadius:"8px",padding:"5px 7px",cursor:"pointer",fontSize:"16px"},onClick:()=>{state.editingVar.icon=ic;render();}},ic);iRow.appendChild(ib);});
      wrap.appendChild(iRow);
      const cRow=div({display:"flex",gap:"6px",flexWrap:"wrap",marginBottom:"12px"});
      COLORS.forEach(c=>{const cb=el("button",{style:{width:"26px",height:"26px",borderRadius:"50%",background:c,border:state.editingVar.color===c?"3px solid white":"3px solid transparent",cursor:"pointer"},onClick:()=>{state.editingVar.color=c;render();}});cRow.appendChild(cb);});
      wrap.appendChild(cRow);
      const r3=div({display:"flex",gap:"8px"});
      r3.appendChild(btn("✓ "+L.save,{background:"linear-gradient(135deg,#10b981,#059669)",flex:"1",padding:"10px"},()=>{persistConfig({...state.config,variable:state.config.variable.map(x=>x.id===state.editingVar.id?{...x,...state.editingVar,budget:Number(state.editingVar.budget)}:x)});setState({editingVar:null});}));
      r3.appendChild(btn(L.cancel,{background:"rgba(239,68,68,0.15)",color:"#fca5a5",border:"1px solid rgba(239,68,68,0.3)",padding:"10px 14px"},()=>setState({editingVar:null})));
      wrap.appendChild(r3);vCard.appendChild(wrap);
    } else {
      const row=div({display:"flex",justifyContent:"space-between",alignItems:"center",background:TH.surface,borderRadius:"12px",padding:"10px 14px",marginBottom:"8px"});
      row.appendChild(div({display:"flex",alignItems:"center",gap:"10px"},[span({fontSize:"20px"},v.icon),div({},[p({margin:"0",fontSize:"13px",fontWeight:"600"},v.name),p({margin:"0",fontSize:"11px",color:v.color,fontWeight:"700"},`${v.budget}€`)])]));
      const btns4=div({display:"flex",gap:"6px"});
      btns4.appendChild(btn("✏",{background:"rgba(124,58,237,0.15)",color:"#c4b5fd",border:"1px solid rgba(124,58,237,0.3)",padding:"4px 10px",fontSize:"12px"},()=>setState({editingVar:{...v}})));
      btns4.appendChild(btn("🗑",{background:"rgba(239,68,68,0.15)",color:"#fca5a5",border:"1px solid rgba(239,68,68,0.3)",padding:"4px 10px",fontSize:"12px"},()=>persistConfig({...state.config,variable:state.config.variable.filter(x=>x.id!==v.id)})));
      row.appendChild(btns4);vCard.appendChild(row);
    }
  });
  const addVWrap=div({borderTop:`1px solid ${TH.border}`,paddingTop:"14px",marginTop:"6px"});
  addVWrap.appendChild(el("label",{className:"lbl"},L.addVar));
  const avRow=div({display:"flex",gap:"8px",marginTop:"8px",marginBottom:"10px"});
  const avn=inp({placeholder:L.namePh,value:state.newVar.name,style:{flex:"2"}});avn.addEventListener("input",e=>state.newVar.name=e.target.value);
  const avb=inp({type:"number",placeholder:"€",value:state.newVar.budget,style:{flex:"1"}});avb.addEventListener("input",e=>state.newVar.budget=e.target.value);
  avRow.appendChild(avn);avRow.appendChild(avb);addVWrap.appendChild(avRow);
  const avIcons=div({display:"flex",flexWrap:"wrap",gap:"6px",marginBottom:"10px"});
  ICONS.forEach(ic=>{const ib=el("button",{style:{background:state.newVar.icon===ic?"rgba(124,58,237,0.4)":"rgba(255,255,255,0.05)",border:state.newVar.icon===ic?"2px solid #7c3aed":"2px solid transparent",borderRadius:"8px",padding:"5px 7px",cursor:"pointer",fontSize:"16px"},onClick:()=>{state.newVar.icon=ic;render();}},ic);avIcons.appendChild(ib);});
  addVWrap.appendChild(avIcons);
  const avColors=div({display:"flex",gap:"6px",flexWrap:"wrap",marginBottom:"12px"});
  COLORS.forEach(c=>{const cb=el("button",{style:{width:"26px",height:"26px",borderRadius:"50%",background:c,border:state.newVar.color===c?"3px solid white":"3px solid transparent",cursor:"pointer"},onClick:()=>{state.newVar.color=c;render();}});avColors.appendChild(cb);});
  addVWrap.appendChild(avColors);
  addVWrap.appendChild(btn(L.addVar,{background:"linear-gradient(135deg,#7c3aed,#2563eb)",width:"100%",padding:"12px",fontSize:"14px",borderRadius:"14px"},()=>{
    if(!state.newVar.name.trim()||!state.newVar.budget)return;
    persistConfig({...state.config,variable:[...state.config.variable,{id:Date.now(),name:state.newVar.name.trim(),budget:Number(state.newVar.budget),icon:state.newVar.icon,color:state.newVar.color}]});
    setState({newVar:{name:"",budget:"",icon:"💳",color:"#8b5cf6"}});
  }));
  vCard.appendChild(addVWrap);content.appendChild(vCard);
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  app.appendChild(renderApp());
}

render();
</script>
