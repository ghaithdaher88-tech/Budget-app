function getMonthKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;}
function getMonthLabel(k,t){const[y,m]=k.split("-");return `${t.months[parseInt(m)-1]} ${y}`;}
function ls(k,fb){try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch{return fb;}}
function lsw(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}

function HealthMeter({score,t,th}){
  const label=score>=80?t.excellent:score>=60?t.good:score>=40?t.warning:t.critical;
  const color=score>=80?"#10b981":score>=60?"#f59e0b":score>=40?"#f97316":"#ef4444";
  return(
    <div style={{background:th.card,border:`1px solid ${th.border}`,borderRadius:16,padding:16,textAlign:"center"}}>
      <p style={{fontSize:11,color:th.sub,marginBottom:8}}>{t.healthScore}</p>
      <div style={{position:"relative",width:90,height:90,margin:"0 auto 8px"}}>
        <svg viewBox="0 0 36 36" style={{width:"100%",height:"100%",transform:"rotate(-90deg)"}}>
          <circle cx="18" cy="18" r="15" fill="none" stroke={th.border} strokeWidth="3"/>
          <circle cx="18" cy="18" r="15" fill="none" stroke={color} strokeWidth="3"
            strokeDasharray={`${score*0.942} 94.2`} strokeLinecap="round"/>
        </svg>
        <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
          <span style={{fontSize:18,fontWeight:900,color}}>{score}</span>
        </div>
      </div>
      <p style={{fontSize:12,fontWeight:700,color}}>{label}</p>
    </div>
  );
}

export default function App(){
  const now=new Date();
  const currentKey=getMonthKey(now);
  const [lang,setLang]=useState(()=>ls("bl","ar"));
  const [theme,setTheme]=useState(()=>ls("bt","dark"));
  const [config,setConfig]=useState(()=>ls("bc",DEFAULT_CONFIG));
  const [allData,setAllData]=useState(()=>ls("bd",{}));
  const [selectedMonth,setSelectedMonth]=useState(currentKey);
  const [activeTab,setActiveTab]=useState("dashboard");
  const [showMonthPicker,setShowMonthPicker]=useState(false);
  const [saveFlash,setSaveFlash]=useState(false);
  const [editIncome,setEditIncome]=useState(false);
  const [incomeInput,setIncomeInput]=useState(config.income);
  const [newFixed,setNewFixed]=useState({name:"",amount:""});
  const [newVar,setNewVar]=useState({name:"",budget:"",icon:"💳",color:"#8b5cf6"});
  const [editingFixed,setEditingFixed]=useState(null);
  const [editingVar,setEditingVar]=useState(null);
  const [form,setForm]=useState({desc:"",amount:"",category:config.variable[0]?.name||"",date:now.toISOString().split("T")[0]});
  const [formError,setFormError]=useState("");
  const [reportText,setReportText]=useState("");
  const [reportLoading,setReportLoading]=useState(false);
  const [gmailStatus,setGmailStatus]=useState("");
  const [settingsMsg,setSettingsMsg]=useState("");
  const [notification,setNotification]=useState(null);

  const t=T[lang];
  const th=THEMES[theme];

  useEffect(()=>{document.documentElement.dir=t.dir;document.documentElement.lang=lang;},[lang]);

  const expenses=allData[selectedMonth]||[];
  const totalFixed=config.fixed.reduce((s,i)=>s+i.amount,0);
  const totalVarBudget=config.variable.reduce((s,i)=>s+i.budget,0);
  const totalSpent=expenses.reduce((s,e)=>s+e.amount,0);
  const remaining=totalVarBudget-totalSpent;
  const spent=(cat)=>expenses.filter(e=>e.category===cat).reduce((s,e)=>s+e.amount,0);
  const savingsAmt=Math.max(0,remaining);
  const healthScore=Math.min(100,Math.round(((config.income-totalFixed-totalSpent)/config.income)*100*2+50));
  const clampedHealth=Math.max(0,Math.min(100,healthScore));

  const notify=(msg,type="success")=>{setNotification({msg,type});setTimeout(()=>setNotification(null),3000);};
  const persistConfig=(c)=>{setConfig(c);lsw("bc",c);notify(t.save);};
  const persistData=(d)=>{setAllData(d);lsw("bd",d);setSaveFlash(true);setTimeout(()=>setSaveFlash(false),2000);};

  const changeLang=(l)=>{setLang(l);lsw("bl",l);};
  const changeTheme=(th)=>{setTheme(th);lsw("bt",th);};

  const allMonths=[...new Set([...Object.keys(allData).filter(k=>(allData[k]||[]).length>0),currentKey])].sort((a,b)=>b.localeCompare(a));

  const addExpense=()=>{
    if(!form.desc.trim()){setFormError(t.errDesc);return;}
    if(!form.amount||isNaN(form.amount)||Number(form.amount)<=0){setFormError(t.errAmount);return;}
    const updated={...allData,[selectedMonth]:[{id:Date.now(),...form,amount:Number(form.amount)},...(allData[selectedMonth]||[])]};
    persistData(updated);
    setForm({desc:"",amount:"",category:config.variable[0]?.name||"",date:now.toISOString().split("T")[0]});
    setFormError("");setActiveTab("dashboard");
    notify("✓ "+t.saveExpense);
  };
  const deleteExpense=(id)=>{persistData({...allData,[selectedMonth]:expenses.filter(e=>e.id!==id)});notify(t.delete,"info");};

  const updateIncome=()=>{persistConfig({...config,income:Number(incomeInput)});setEditIncome(false);};
  const addFixed=()=>{if(!newFixed.name.trim()||!newFixed.amount||isNaN(newFixed.amount))return;persistConfig({...config,fixed:[...config.fixed,{id:Date.now(),name:newFixed.name.trim(),amount:Number(newFixed.amount)}]});setNewFixed({name:"",amount:""});};
  const delFixed=(id)=>persistConfig({...config,fixed:config.fixed.filter(f=>f.id!==id)});
  const saveEditFixed=()=>{persistConfig({...config,fixed:config.fixed.map(f=>f.id===editingFixed.id?{...f,name:editingFixed.name,amount:Number(editingFixed.amount)}:f)});setEditingFixed(null);};
  const addVar=()=>{if(!newVar.name.trim()||!newVar.budget||isNaN(newVar.budget))return;persistConfig({...config,variable:[...config.variable,{id:Date.now(),name:newVar.name.trim(),budget:Number(newVar.budget),icon:newVar.icon,color:newVar.color}]});setNewVar({name:"",budget:"",icon:"💳",color:"#8b5cf6"});};
  const delVar=(id)=>persistConfig({...config,variable:config.variable.filter(v=>v.id!==id)});
  const saveEditVar=()=>{persistConfig({...config,variable:config.variable.map(v=>v.id===editingVar.id?{...v,...editingVar,budget:Number(editingVar.budget)}:v)});setEditingVar(null);};

  // ---- ACCOUNTING / BUCHUNGSSÄTZE ----
  const generateJournalEntries=()=>{
    return expenses.map(e=>({
      date:e.date, desc:e.desc, amount:e.amount,
      soll:ACCOUNT_MAP[e.category]||ACCOUNT_MAP["default"],
      haben:"1200", // Bank account
      category:e.category,
    }));
  };

  // ---- EXPORT EXCEL (Buchungssätze + Bilanz) ----
  const exportExcel=()=>{
    const wb=XLSX.utils.book_new();
    const entries=generateJournalEntries();
    // Sheet 1: Buchungssätze
    const journalData=[
      [t.date,t.desc,t.category,t.debit,t.credit,t.amount+" €"],
      ...entries.map(e=>[e.date,e.desc,e.category,e.soll,e.haben,e.amount.toFixed(2)])
    ];
    const ws1=XLSX.utils.aoa_to_sheet(journalData);
    ws1["!cols"]=[{wch:12},{wch:30},{wch:20},{wch:10},{wch:10},{wch:12}];
    XLSX.utils.book_append_sheet(wb,ws1,t.buchungssatz);

    // Sheet 2: Bilanz
    const bilanzdaten=[
      [t.aktiva,"","",t.passiva,""],
      [t.salary,"",config.income.toFixed(2)+"€","",t.fixedExpenses,totalFixed.toFixed(2)+"€"],
      [t.variableBudgets,"",totalVarBudget.toFixed(2)+"€","",t.spent,totalSpent.toFixed(2)+"€"],
      ["","","","","",],
      [t.remaining,"",remaining.toFixed(2)+"€","","",""],
      [t.totalBalance,"",config.income.toFixed(2)+"€","",t.totalBalance,config.income.toFixed(2)+"€"],

    // Sheet 3: Monatsübersicht
    const summaryData=[

      [t.salary, config.income.toFixed(2)+"€"],

  // ---- EXPORT DATEV CSV ----
  const exportDATEV=()=>{

    const rows=entries.map(e=>`"${e.amount.toFixed(2)}";"S";"EUR";"";"";"";"${e.soll}";"${e.haben}";"${e.date.split("-").reverse().join("")}";"${e.id||""}";"${e.desc}"`);
    const csv=header+"\n"+rows.join("\n");
    const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=`DATEV_${getMonthLabel(selectedMonth,t).replace(" ","_")}.csv`;a.click();
    notify("✓ DATEV CSV "+t.exportDATEV);

    const exps=expenses.slice(0,20).map(e=>`${e.date}: ${e.desc} ${e.amount}€`).join(" | ");
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1200,messages:[{role:"user",content:t.prompt(getMonthLabel(selectedMonth,t),config.income,totalFixed,totalSpent.toFixed(2),remaining.toFixed(2),rows,exps)}]})});
      const data=await res.json();
      setReportText(data.content?.map(i=>i.text||"").join("")||"Error");
    }catch{setReportText("Error");}
    setReportLoading(false);
  };

    const rows=config.variable.map(v=>`• ${v.name}: ${v.budget}€ / ${spent(v.name).toFixed(2)}€ ${spent(v.name)>v.budget?"⚠":"✓"}`).join("\n");

    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:300,mcp_servers:[{type:"url",url:"https://gmailmcp.googleapis.com/mcp/v1",name:"gmail"}],messages:[{role:"user",content:`Create Gmail draft: subject="BudgetPro - ${getMonthLabel(selectedMonth,t)}", body="${body}". Reply: SUCCESS or FAILED`}]})});
      const data=await res.json();

              <p style={{margin:"0 0 8px",fontSize:13,fontWeight:700,color:"#60a5fa"}}>ℹ️ DATEV & SAP</p>
              <p style={{margin:0,fontSize:12,color:th.sub,lineHeight:1.7}}>
                {lang==="ar"?"ملف DATEV CSV متوافق مع برنامج DATEV Unternehmen online. لاستيراده: DATEV → Buchführung → Belege → CSV importieren. لـ SAP: استخدم ملف Excel مع تنسيق SKR03/SKR04.":
                lang==="de"?"Die DATEV CSV-Datei ist kompatibel mit DATEV Unternehmen online. Import: DATEV → Buchführung → Belege → CSV importieren. Für SAP: Excel-Datei mit SKR03/SKR04-Format verwenden.":
                "The DATEV CSV file is compatible with DATEV Unternehmen online. Import: DATEV → Bookkeeping → Documents → Import CSV. For SAP: Use Excel file with SKR03/SKR04 format."}
              </p>
            </div>

            {/* Journal Entries Table */}
            <div style={S.card()}>
              <h4 style={{margin:"0 0 14px",fontSize:13,fontWeight:800,color:th.text}}>{t.buchungssatz}</h4>
              {expenses.length===0?(
                <p style={{color:th.sub,fontSize:13,textAlign:"center",padding:"20px 0"}}>{t.noExpenses}</p>
              ):(
                <div style={{overflowX:"auto"}}>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                    <thead>
                      <tr style={{borderBottom:`2px solid ${th.border}`}}>
                        {[t.date,t.desc,t.debit,t.credit,t.amount+" €"].map(h=>(
                          <th key={h} style={{padding:"8px 6px",color:th.sub,fontWeight:700,textAlign:t.dir==="rtl"?"right":"left",whiteSpace:"nowrap"}}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {generateJournalEntries().map((e,i)=>(
                        <tr key={i} style={{borderBottom:`1px solid ${th.border}`}}>
                          <td style={{padding:"8px 6px",color:th.sub,whiteSpace:"nowrap"}}>{e.date}</td>
                          <td style={{padding:"8px 6px",maxWidth:120,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e.desc}</td>
                          <td style={{padding:"8px 6px",color:"#ef4444",fontWeight:700}}>{e.soll}</td>
                          <td style={{padding:"8px 6px",color:"#10b981",fontWeight:700}}>{e.haben}</td>
                          <td style={{padding:"8px 6px",fontWeight:800}}>{e.amount.toFixed(2)}€</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>

            {/* Mini Balance Sheet */}
            <div style={S.card()}>
              <h4 style={{margin:"0 0 14px",fontSize:13,fontWeight:800,color:th.text}}>{t.balanceSheet}</h4>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                <div style={{background:"rgba(16,185,129,0.08)",border:"1px solid rgba(16,185,129,0.2)",borderRadius:12,padding:12}}>
                  <p style={{margin:"0 0 10px",fontSize:11,fontWeight:700,color:"#10b981",textTransform:"uppercase",letterSpacing:"0.5px"}}>{t.aktiva}</p>
                  {[{l:t.income,v:config.income},{l:t.variableBudgets,v:totalVarBudget}].map(r=>(
                    <div key={r.l} style={{display:"flex",justifyContent:"space-between",padding:"4px 0",borderBottom:`1px solid rgba(16,185,129,0.1)`}}>
                      <span style={{fontSize:11,color:th.sub}}>{r.l}</span>
                      <span style={{fontSize:12,fontWeight:700,color:"#10b981"}}>{r.v}€</span>
                    </div>
                  ))}
                  <div style={{display:"flex",justifyContent:"space-between",paddingTop:8,marginTop:4}}>
                    <span style={{fontSize:12,fontWeight:700}}>{t.total}</span>
                    <span style={{fontSize:14,fontWeight:900,color:"#10b981"}}>{(config.income+totalVarBudget).toFixed(0)}€</span>
                  </div>
                </div>
                <div style={{background:"rgba(239,68,68,0.08)",border:"1px solid rgba(239,68,68,0.2)",borderRadius:12,padding:12}}>
                  <p style={{margin:"0 0 10px",fontSize:11,fontWeight:700,color:"#ef4444",textTransform:"uppercase",letterSpacing:"0.5px"}}>{t.passiva}</p>
                  {[{l:t.fixedExpenses,v:totalFixed},{l:t.spent,v:totalSpent.toFixed(2)}].map(r=>(
                    <div key={r.l} style={{display:"flex",justifyContent:"space-between",padding:"4px 0",borderBottom:`1px solid rgba(239,68,68,0.1)`}}>
                      <span style={{fontSize:11,color:th.sub}}>{r.l}</span>
                      <span style={{fontSize:12,fontWeight:700,color:"#ef4444"}}>{r.v}€</span>
                    </div>
                  ))}
                  <div style={{display:"flex",justifyContent:"space-between",paddingTop:8,marginTop:4}}>
                    <span style={{fontSize:12,fontWeight:700}}>{t.total}</span>
                    <span style={{fontSize:14,fontWeight:900,color:"#ef4444"}}>{(totalFixed+totalSpent).toFixed(0)}€</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        )}

        {/* ===== REPORT ===== */}
        {activeTab==="report"&&(
          <div className="fade-in" style={{display:"flex",flexDirection:"column",gap:16}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <h3 style={{margin:0,fontSize:15,fontWeight:800}}>{t.reportTitle}</h3>
              <div style={{display:"flex",gap:8}}>
                <button onClick={generateReport} style={S.btn("rgba(124,58,237,0.2)",{border:"1px solid rgba(124,58,237,0.4)",color:"#c4b5fd",padding:"8px 14px",fontSize:12})}>{t.refresh}</button>
                <button onClick={()=>window.print()} style={S.btn("linear-gradient(135deg,#7c3aed,#2563eb)",{padding:"8px 14px",fontSize:12})}>{t.exportPDF}</button>
              </div>
            </div>

            {/* Gmail */}
            <div style={{background:"rgba(234,67,53,0.06)",border:"1px solid rgba(234,67,53,0.2)",borderRadius:18,padding:"16px 18px"}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:12}}>
                <div style={{display:"flex",alignItems:"center",gap:12}}>
                  <div style={{width:36,height:36,borderRadius:10,background:"linear-gradient(135deg,#ea4335,#c62828)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>✉️</div>
                  <div>
                    <p style={{margin:0,fontSize:13,fontWeight:700,color:"#fca5a5"}}>{t.gmailWeekly}</p>
                    <p style={{margin:0,fontSize:11,color:th.sub}}>{t.gmailDesc}</p>
                  </div>
                </div>
                <button onClick={sendGmail} disabled={gmailStatus==="loading"} style={S.btn("linear-gradient(135deg,#ea4335,#c62828)",{padding:"10px 16px",opacity:gmailStatus==="loading"?0.6:1,flexShrink:0})}>
                  {gmailStatus==="loading"?t.gmailSending:gmailStatus==="success"?t.gmailOk:gmailStatus==="error"?t.gmailErr:t.gmailSend}
                </button>
              </div>
              {gmailStatus==="success"&&<p style={{margin:"10px 0 0",fontSize:12,color:"#6ee7b7"}}>{t.gmailDone}</p>}
              {gmailStatus==="error"&&<p style={{margin:"10px 0 0",fontSize:12,color:"#fca5a5"}}>{t.gmailFail}</p>}
            </div>

            {/* Summary */}
            <div className="print-area" style={S.card()}>
              <h4 style={{margin:"0 0 14px",fontSize:13,fontWeight:800}}>{t.monthSummary}</h4>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:18}}>
                {[{l:t.salary,v:config.income,c:"#10b981"},{l:t.fixedExpenses,v:totalFixed,c:"#f59e0b"},{l:t.spent,v:totalSpent.toFixed(2),c:"#ef4444"},{l:t.remaining,v:remaining.toFixed(2),c:remaining>=0?"#10b981":"#ef4444"}].map(r=>(
                  <div key={r.l} style={{background:th.surface,borderRadius:12,padding:"12px 14px"}}>
                    <p style={{margin:0,fontSize:10,color:th.sub,textTransform:"uppercase",letterSpacing:"0.5px"}}>{r.l}</p>
                    <p style={{margin:"4px 0 0",fontSize:18,fontWeight:900,color:r.c}}>{r.v}<span style={{fontSize:11}}>€</span></p>
                  </div>
                ))}
              </div>

              <h4 style={{margin:"0 0 12px",fontSize:13,fontWeight:800}}>{t.budgetDetails}</h4>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:12,marginBottom:18}}>
                <thead><tr style={{borderBottom:`2px solid ${th.border}`}}>
                  {[t.category,t.budget,t.spent,t.remaining,t.status].map(h=><th key={h} style={{padding:"8px 6px",color:th.sub,fontWeight:700,textAlign:t.dir==="rtl"?"right":"left"}}>{h}</th>)}
                </tr></thead>
                <tbody>
                  {config.variable.map(v=>{const s=spent(v.name);const r=v.budget-s;return(
                    <tr key={v.id} style={{borderBottom:`1px solid ${th.border}`}}>
                      <td style={{padding:"8px 6px"}}>{v.icon} {v.name}</td>
                      <td style={{padding:"8px 6px",color:th.sub}}>{v.budget}€</td>
                      <td style={{padding:"8px 6px",color:"#ef4444",fontWeight:700}}>{s.toFixed(2)}€</td>
                      <td style={{padding:"8px 6px",color:r>=0?"#10b981":"#ef4444",fontWeight:700}}>{r.toFixed(2)}€</td>
                      <td style={{padding:"8px 6px",fontSize:11}}>{r>=0?t.withinBudget:t.exceeded}</td>
                    </tr>
                  );})}
                </tbody>
              </table>

              <h4 style={{margin:"0 0 12px",fontSize:13,fontWeight:800}}>{t.aiAnalysis}</h4>
              {!reportText?(
                <button onClick={generateReport} style={S.btn("linear-gradient(135deg,#7c3aed,#2563eb)",{width:"100%",padding:"14px",fontSize:14,borderRadius:14})}>✨ {t.generateAnalysis}</button>
              ):reportLoading?(
                <div style={{textAlign:"center",padding:32,color:th.sub}}><div style={{fontSize:32,marginBottom:8}}>⏳</div><p style={{margin:0}}>{t.analyzing}</p></div>
              ):(
                <div style={{fontSize:13,lineHeight:2,color:th.text,whiteSpace:"pre-wrap",background:th.surface,borderRadius:14,padding:16}}>{reportText}</div>
              )}
            </div>
          </div>
        )}

        {/* ===== SETTINGS ===== */}
        {activeTab==="settings"&&(
          <div className="fade-in" style={{display:"flex",flexDirection:"column",gap:16}}>
            <h3 style={{margin:0,fontSize:15,fontWeight:800}}>⚙️ {t.settings}</h3>

            {/* Language */}
            <div style={S.card()}>
              <h4 style={{margin:"0 0 14px",fontSize:13,fontWeight:800,color:"#60a5fa"}}>🌐 {t.language}</h4>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
                {[["ar","العربية","🇸🇦"],["en","English","🇬🇧"],["de","Deutsch","🇩🇪"]].map(([code,label,flag])=>(
                  <button key={code} onClick={()=>changeLang(code)} style={{padding:"14px 8px",borderRadius:14,border:`2px solid ${lang===code?"#7c3aed":th.border}`,background:lang===code?"linear-gradient(135deg,rgba(124,58,237,0.15),rgba(37,99,235,0.15))":th.surface,color:th.text,fontSize:13,fontFamily:t.font,fontWeight:700,cursor:"pointer",transition:"all 0.2s"}}>
                    <div style={{fontSize:24,marginBottom:4}}>{flag}</div>
                    <div style={{fontSize:11}}>{label}</div>
                    {lang===code&&<div style={{fontSize:8,color:"#7c3aed",marginTop:2}}>✓ Active</div>}
                  </button>
                ))}
              </div>
            </div>

            {/* Theme */}
            <div style={S.card()}>
              <h4 style={{margin:"0 0 14px",fontSize:13,fontWeight:800,color:"#60a5fa"}}>🎨 {t.theme}</h4>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
                {Object.entries(THEMES).map(([key,th2])=>(
                  <button key={key} onClick={()=>changeTheme(key)} style={{padding:"14px 8px",borderRadius:14,border:`2px solid ${theme===key?"#7c3aed":"transparent"}`,background:th2.bg,cursor:"pointer",transition:"all 0.2s",position:"relative",overflow:"hidden"}}>
                    <div style={{width:20,height:20,borderRadius:"50%",background:`linear-gradient(135deg,${th2.accent},${th2.accent}88)`,margin:"0 auto 6px"}}/>
                    <div style={{fontSize:10,color:th2.text,fontWeight:700,fontFamily:t.font}}>{th2.name[lang]||th2.name.en}</div>
                    {theme===key&&<div style={{position:"absolute",top:4,right:4,width:8,height:8,borderRadius:"50%",background:"#7c3aed"}}/>}
                  </button>
                ))}
              </div>
            </div>

            {/* Income */}
            <div style={S.card()}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:editIncome?16:0}}>
                <h4 style={{margin:0,fontSize:13,fontWeight:800,color:"#fbbf24"}}>💵 {t.monthlySalary}</h4>
                <button onClick={()=>setEditIncome(!editIncome)} style={S.btn(editIncome?"rgba(239,68,68,0.15)":"rgba(251,191,36,0.15)",{color:editIncome?"#fca5a5":"#fbbf24",border:`1px solid ${editIncome?"rgba(239,68,68,0.3)":"rgba(251,191,36,0.3)"}`,padding:"7px 14px"})}>{editIncome?t.cancel:t.edit}</button>
              </div>
              {editIncome?(
                <div style={{display:"flex",gap:8}}>
                  <input type="number" value={incomeInput} onChange={e=>setIncomeInput(e.target.value)} style={{...S.inp(),flex:1}}/>
                  <button onClick={updateIncome} style={S.btn("linear-gradient(135deg,#7c3aed,#2563eb)",{padding:"11px 18px"})}>{t.save}</button>
                </div>
              ):(<p style={{margin:"10px 0 0",fontSize:24,fontWeight:900,color:"#10b981"}}>{config.income}<span style={{fontSize:14}}>€</span></p>)}
            </div>

            {/* Fixed */}
            <div style={S.card()}>
              <h4 style={{margin:"0 0 14px",fontSize:13,fontWeight:800,color:"#fbbf24"}}>📌 {t.fixedCats}</h4>
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {config.fixed.map(f=>(
                  <div key={f.id}>
                    {editingFixed?.id===f.id?(
                      <div className="fade-in" style={{display:"flex",gap:6,alignItems:"center",background:th.surface,borderRadius:12,padding:8}}>
                        <input value={editingFixed.name} onChange={e=>setEditingFixed({...editingFixed,name:e.target.value})} style={{...S.inp(),flex:2,padding:"8px 12px"}}/>
                        <input type="number" value={editingFixed.amount} onChange={e=>setEditingFixed({...editingFixed,amount:e.target.value})} style={{...S.inp(),flex:1,padding:"8px 12px"}}/>
                        <button onClick={saveEditFixed} style={S.btn("linear-gradient(135deg,#10b981,#059669)",{padding:"8px 12px"})}>✓</button>
                        <button onClick={()=>setEditingFixed(null)} style={S.btn("rgba(239,68,68,0.2)",{color:"#fca5a5",border:"1px solid rgba(239,68,68,0.3)",padding:"8px 10px"})}>✕</button>
                      </div>
                    ):(
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:th.surface,borderRadius:12,padding:"10px 14px"}}>
                        <div style={{display:"flex",alignItems:"center",gap:10}}>
                          <div style={{width:8,height:8,borderRadius:"50%",background:"#f59e0b"}}/>
                          <span style={{fontSize:13}}>{f.name}</span>
                        </div>
                        <div style={{display:"flex",alignItems:"center",gap:10}}>
                          <span style={{fontWeight:800,color:"#f59e0b"}}>{f.amount}€</span>
                          <button onClick={()=>setEditingFixed({...f})} style={S.btn("rgba(124,58,237,0.15)",{color:"#c4b5fd",border:"1px solid rgba(124,58,237,0.3)",padding:"4px 10px",fontSize:11})}>✏</button>
                          <button onClick={()=>delFixed(f.id)} style={S.btn("rgba(239,68,68,0.15)",{color:"#fca5a5",border:"1px solid rgba(239,68,68,0.3)",padding:"4px 10px",fontSize:11})}>🗑</button>
                        </div>
                      </div>
                    )}
                  </div>
                ))}
              </div>
              <div style={{borderTop:`1px solid ${th.border}`,paddingTop:14,marginTop:14}}>
                <p style={{...S.label,marginBottom:10}}>{t.addFixed}</p>
                <div style={{display:"flex",gap:8}}>
                  <input placeholder={t.namePh} value={newFixed.name} onChange={e=>setNewFixed({...newFixed,name:e.target.value})} style={{...S.inp(),flex:2}}/>
                  <input type="number" placeholder="€" value={newFixed.amount} onChange={e=>setNewFixed({...newFixed,amount:e.target.value})} style={{...S.inp(),flex:1}}/>
                  <button onClick={addFixed} style={S.btn("linear-gradient(135deg,#7c3aed,#2563eb)",{padding:"11px 16px"})}>{t.add2}</button>
                </div>
              </div>
            </div>

            {/* Variable */}
            <div style={S.card()}>
              <h4 style={{margin:"0 0 14px",fontSize:13,fontWeight:800,color:"#c4b5fd"}}>📂 {t.varCats}</h4>
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {config.variable.map(v=>(
                  <div key={v.id}>
                    {editingVar?.id===v.id?(
                      <div className="fade-in" style={{display:"flex",flexDirection:"column",gap:10,background:th.surface,borderRadius:14,padding:14}}>
                        <div style={{display:"flex",gap:8}}>
                          <input value={editingVar.name} onChange={e=>setEditingVar({...editingVar,name:e.target.value})} style={{...S.inp(),flex:2}}/>
                          <input type="number" value={editingVar.budget} onChange={e=>setEditingVar({...editingVar,budget:e.target.value})} style={{...S.inp(),flex:1}}/>
                        </div>
                        <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                          {ICONS.map(ic=><button key={ic} onClick={()=>setEditingVar({...editingVar,icon:ic})} style={{background:editingVar.icon===ic?"rgba(124,58,237,0.4)":"rgba(255,255,255,0.05)",border:editingVar.icon===ic?"2px solid #7c3aed":"2px solid transparent",borderRadius:8,padding:"5px 7px",cursor:"pointer",fontSize:16}}>{ic}</button>)}
                        </div>
                        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                          {COLORS.map(c=><button key={c} onClick={()=>setEditingVar({...editingVar,color:c})} style={{width:26,height:26,borderRadius:"50%",background:c,border:editingVar.color===c?"3px solid white":"3px solid transparent",cursor:"pointer"}}/>)}
                        </div>
                        <div style={{display:"flex",gap:8}}>
                          <button onClick={saveEditVar} style={S.btn("linear-gradient(135deg,#10b981,#059669)",{flex:1,padding:"10px"})}>✓ {t.save}</button>
                          <button onClick={()=>setEditingVar(null)} style={S.btn("rgba(239,68,68,0.15)",{color:"#fca5a5",border:"1px solid rgba(239,68,68,0.3)",padding:"10px 16px"})}>{t.cancel}</button>
                        </div>
                      </div>
                    ):(
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:th.surface,borderRadius:12,padding:"10px 14px"}}>
                        <div style={{display:"flex",alignItems:"center",gap:10}}>
                          <span style={{fontSize:20}}>{v.icon}</span>
                          <div>
                            <p style={{margin:0,fontSize:13,fontWeight:600}}>{v.name}</p>
                            <p style={{margin:0,fontSize:11,color:v.color,fontWeight:700}}>{v.budget}€</p>
                          </div>
                        </div>
                        <div style={{display:"flex",gap:6}}>
                          <button onClick={()=>setEditingVar({...v})} style={S.btn("rgba(124,58,237,0.15)",{color:"#c4b5fd",border:"1px solid rgba(124,58,237,0.3)",padding:"4px 10px",fontSize:11})}>✏</button>
                          <button onClick={()=>delVar(v.id)} style={S.btn("rgba(239,68,68,0.15)",{color:"#fca5a5",border:"1px solid rgba(239,68,68,0.3)",padding:"4px 10px",fontSize:11})}>🗑</button>
                        </div>
                      </div>
                    )}
                  </div>
                ))}
              </div>
              <div style={{borderTop:`1px solid ${th.border}`,paddingTop:14,marginTop:14}}>
                <p style={{...S.label,marginBottom:10}}>{t.addVar}</p>
                <div style={{display:"flex",gap:8,marginBottom:10}}>
                  <input placeholder={t.namePh} value={newVar.name} onChange={e=>setNewVar({...newVar,name:e.target.value})} style={{...S.inp(),flex:2}}/>
                  <input type="number" placeholder="€" value={newVar.budget} onChange={e=>setNewVar({...newVar,budget:e.target.value})} style={{...S.inp(),flex:1}}/>
                </div>
                <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:10}}>
                  {ICONS.map(ic=><button key={ic} onClick={()=>setNewVar({...newVar,icon:ic})} style={{background:newVar.icon===ic?"rgba(124,58,237,0.4)":"rgba(255,255,255,0.05)",border:newVar.icon===ic?"2px solid #7c3aed":"2px solid transparent",borderRadius:8,padding:"5px 7px",cursor:"pointer",fontSize:16}}>{ic}</button>)}
                </div>
                <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
                  {COLORS.map(c=><button key={c} onClick={()=>setNewVar({...newVar,color:c})} style={{width:26,height:26,borderRadius:"50%",background:c,border:newVar.color===c?"3px solid white":"3px solid transparent",cursor:"pointer"}}/>)}
                </div>
                <button onClick={addVar} style={S.btn("linear-gradient(135deg,#7c3aed,#2563eb)",{width:"100%",padding:"12px",fontSize:14,borderRadius:14})}>{t.addVar}</button>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
