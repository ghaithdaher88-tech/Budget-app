<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes">

<title>BudgetPro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"/>

<style>
:root {
  --bg: #0F172A;
  --surface: #131C31;
  --card: #1A2540;
  --card2: #1F2D4A;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #F8FAFC;
  --sub: #94A3B8;
  --sub2: #64748B;
  --gold: #F59E0B;
  --gold2: #FBBF24;
  --purple: #8B5CF6;
  --purple2: #A78BFA;
  --blue: #3B82F6;
  --green: #10B981;
  --red: #EF4444;
  --accent: #F59E0B;
  --radius: 16px;
  --radius-sm: 10px;
  --radius-lg: 24px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
body[dir="rtl"]{font-family:'Cairo',sans-serif;}
input,select,button,textarea{font-family:inherit;}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
input:focus,select:focus{outline:none;border-color:var(--purple)!important;box-shadow:0 0 0 3px rgba(139,92,246,0.15);}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:rgba(139,92,246,0.3);border-radius:99px;}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
@keyframes slideIn{from{opacity:0;transform:translateX(16px);}to{opacity:1;transform:translateX(0);}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.5;}}
@keyframes shimmer{from{background-position:-200% 0;}to{background-position:200% 0;}}
@keyframes spin{to{transform:rotate(360deg);}}
.fade-up{animation:fadeUp 0.3s cubic-bezier(0.34,1.56,0.64,1) both;}
.slide-in{animation:slideIn 0.25s ease both;}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
.card-glass{background:rgba(26,37,64,0.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border2);border-radius:var(--radius);padding:20px;}
.card:hover,.card-glass:hover{border-color:var(--border2);transition:border-color 0.2s;}

/* Buttons */
.btn{border:none;border-radius:var(--radius-sm);padding:10px 18px;font-weight:700;cursor:pointer;color:#fff;font-size:13px;transition:all 0.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
.btn:active{transform:scale(0.96);}
.btn-primary{background:linear-gradient(135deg,var(--purple),#6D28D9);}
.btn-primary:hover{background:linear-gradient(135deg,var(--purple2),var(--purple));}
.btn-gold{background:linear-gradient(135deg,var(--gold),#D97706);}
.btn-green{background:linear-gradient(135deg,var(--green),#059669);}
.btn-blue{background:linear-gradient(135deg,var(--blue),#1D4ED8);}
.btn-ghost{background:rgba(255,255,255,0.06);color:var(--sub);}
.btn-ghost:hover{background:rgba(255,255,255,0.1);color:var(--text);}
.btn-danger{background:rgba(239,68,68,0.12);color:#FCA5A5;border:1px solid rgba(239,68,68,0.2);}
.btn-sm{padding:6px 12px;font-size:11px;border-radius:8px;}

/* Inputs */
.inp{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:12px 14px;color:var(--text);font-size:14px;}
.inp::placeholder{color:var(--sub2);}
label.lbl{font-size:11px;color:var(--sub);display:block;margin-bottom:6px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;}

/* Progress */
.progress{height:6px;background:rgba(255,255,255,0.06);border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;border-radius:99px;transition:width 0.6s cubic-bezier(0.34,1.56,0.64,1);}

/* Badge */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:10px;font-weight:700;letter-spacing:0.5px;}
.badge-gold{background:rgba(245,158,11,0.15);color:var(--gold);border:1px solid rgba(245,158,11,0.2);}
.badge-green{background:rgba(16,185,129,0.12);color:var(--green);border:1px solid rgba(16,185,129,0.2);}
.badge-red{background:rgba(239,68,68,0.12);color:var(--red);border:1px solid rgba(239,68,68,0.2);}
.badge-purple{background:rgba(139,92,246,0.12);color:var(--purple2);border:1px solid rgba(139,92,246,0.2);}
.badge-blue{background:rgba(59,130,246,0.12);color:#60A5FA;border:1px solid rgba(59,130,246,0.2);}

/* Divider */
.divider{height:1px;background:var(--border);margin:12px 0;}

/* Toast */
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:linear-gradient(135deg,var(--purple),#6D28D9);color:#fff;padding:11px 22px;border-radius:99px;font-size:13px;font-weight:700;z-index:9999;box-shadow:0 8px 32px rgba(139,92,246,0.4);transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);white-space:nowrap;}
#toast.show{transform:translateX(-50%) translateY(0);}

/* Month Dropdown */
#month-dropdown{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--card2);border:1px solid var(--border2);border-radius:var(--radius);z-index:200;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.6);}
.month-item{width:100%;padding:12px 18px;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--sub);font-size:14px;cursor:pointer;text-align:inherit;display:flex;align-items:center;justify-content:space-between;transition:background 0.15s,color 0.15s;}
.month-item:hover,.month-item.active{background:rgba(139,92,246,0.1);color:var(--purple2);}
.month-item:last-child{border-bottom:none;}

/* Tab Bar */
#tab-bar{position:sticky;top:0;z-index:100;background:rgba(15,23,42,0.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 16px;}
.tab-row{display:flex;gap:2px;max-width:680px;margin:0 auto;padding:10px 0;}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border:none;background:transparent;color:var(--sub2);cursor:pointer;border-radius:12px;transition:all 0.2s;font-family:inherit;}
.tab-btn.active{color:var(--purple2);background:rgba(139,92,246,0.1);}
.tab-icon{font-size:18px;line-height:1;}
.tab-label{font-size:9px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px;}
.kpi-card{border-radius:var(--radius);padding:14px 10px;text-align:center;position:relative;overflow:hidden;}
.kpi-card::before{content:'';position:absolute;inset:0;opacity:0.05;background:radial-gradient(circle at 30% 30%, #fff 0%, transparent 70%);}
.kpi-value{font-size:18px;font-weight:900;line-height:1;margin-bottom:2px;}
.kpi-label{font-size:9px;text-transform:uppercase;letter-spacing:0.8px;opacity:0.7;}
.kpi-icon{font-size:22px;margin-bottom:6px;}

/* Health Ring */
.health-ring{width:80px;height:80px;position:relative;flex-shrink:0;}
.health-ring svg{transform:rotate(-90deg);}
.health-ring .value{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;}

/* Expense Row */
.expense-row{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:10px;transition:border-color 0.15s;}
.expense-row:hover{border-color:var(--border2);}
.expense-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}

/* Category Bar */
.cat-row{margin-bottom:16px;}
.cat-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.cat-info{display:flex;align-items:center;gap:8px;}
.cat-icon{font-size:20px;}
.cat-name{font-size:13px;font-weight:700;}
.cat-amounts{font-size:12px;color:var(--sub);}
.cat-amount-val{font-size:14px;font-weight:900;color:var(--text);}

/* Setting rows */
.setting-row{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}

/* Section title */
.section-title{font-size:13px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:8px;margin-bottom:16px;}
.section-badge{width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0;}

/* Gradient text */
.grad-text{background:linear-gradient(135deg,var(--gold),var(--purple2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.grad-text-blue{background:linear-gradient(135deg,#60A5FA,var(--purple2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

/* Table */
.data-table{width:100%;border-collapse:collapse;font-size:12px;}
.data-table th{padding:8px 8px;color:var(--sub);font-weight:700;text-align:inherit;border-bottom:2px solid var(--border2);font-size:11px;letter-spacing:0.5px;text-transform:uppercase;}
.data-table td{padding:10px 8px;border-bottom:1px solid var(--border);}
.data-table tr:last-child td{border-bottom:none;}

/* Light theme */
body.light{--bg:#F0F4FF;--surface:#FFFFFF;--card:#FFFFFF;--card2:#F5F7FF;--border:rgba(0,0,0,0.07);--border2:rgba(0,0,0,0.12);--text:#0F172A;--sub:#64748B;--sub2:#94A3B8;}
body.light #tab-bar{background:rgba(240,244,255,0.95);}
body.light .inp{background:rgba(0,0,0,0.03);}
body.light .month-item:hover,.light .month-item.active{background:rgba(139,92,246,0.06);}
body.light #month-dropdown{background:#fff;}

/* Forest */
body.forest{--bg:#030F08;--surface:#071A0E;--card:#0C2415;--card2:#102D1A;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);--text:#E0FFE8;--sub:#6EBB88;--sub2:#4A8A62;--accent:#10B981;}
/* Ocean */
body.ocean{--bg:#030C18;--surface:#071525;--card:#0C1E32;--card2:#101E38;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);--text:#E0F0FF;--sub:#6699CC;--sub2:#4477AA;--accent:#0EA5E9;}
/* Rose */
body.rose{--bg:#100508;--surface:#1A0C10;--card:#261318;--card2:#2E1820;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);--text:#FFE0E8;--sub:#BB7788;--sub2:#905060;--accent:#F43F5E;}
/* Midnight */
body.midnight{--bg:#06060F;--surface:#0D0D20;--card:#12122A;--card2:#171730;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);--text:#E0E0FF;--sub:#7777BB;--sub2:#555599;--accent:#818CF8;}
/* Slate */
body.slate{--bg:#0D1117;--surface:#161B22;--card:#1C2128;--card2:#222830;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);--text:#E6EDF3;--sub:#8B949E;--sub2:#6E7681;--accent:#F59E0B;}

@media print{
  #tab-bar,.no-print{display:none!important;}
  body{background:white!important;color:black!important;}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>

function el(tag,cls,attrs){const e=document.createElement(tag);if(cls)e.className=cls;if(attrs)Object.entries(attrs).forEach(([k,v])=>k==="style"?Object.assign(e.style,v):(k.startsWith("on")?e.addEventListener(k.slice(2).toLowerCase(),v):e.setAttribute(k,v)));return e;}
function div(cls,attrs){return el("div",cls,attrs);}
function btn(text,cls,onClick,attrs={}){const b=el("button","btn "+cls,{...attrs,onClick});b.innerHTML=text;return b;}
function inp(attrs={}){const i=el("input","inp",attrs);return i;}
function lbl(text){const l=el("label","lbl");l.textContent=text;return l;}
function txt(tag,cls,text,style={}){const e=el(tag,cls);e.textContent=text;if(Object.keys(style).length)Object.assign(e.style,style);return e;}
function append(parent,...children){children.filter(Boolean).forEach(c=>parent.appendChild(c));return parent;}
function row(cls,attrsOrChild,...rest){const isNode=attrsOrChild&&typeof attrsOrChild.appendChild==="function";if(attrsOrChild&&!isNode){const d=div(cls,attrsOrChild);append(d,...rest);return d;}else{const d=div(cls);if(attrsOrChild)append(d,attrsOrChild,...rest);return d;}}

      const wrap=div("",{style:{background:"var(--card2)",borderRadius:"14px",padding:"14px",marginBottom:"10px"}});
      const r1=div("",{style:{display:"flex",gap:"8px",marginBottom:"12px"}});
      const vn=inp({value:ST.editingVar.name,style:{flex:"2"}});vn.addEventListener("input",e=>ST.editingVar.name=e.target.value);
      const vb=inp({type:"number",value:ST.editingVar.budget,style:{flex:"1"}});vb.addEventListener("input",e=>ST.editingVar.budget=e.target.value);
      append(r1,vn,vb);wrap.appendChild(r1);
      const iWrap=div("",{style:{display:"flex",flexWrap:"wrap",gap:"6px",marginBottom:"10px"}});
      ICONS.forEach(ic=>{const ib=el("button","",{style:{background:ST.editingVar.icon===ic?"rgba(139,92,246,0.3)":"rgba(255,255,255,0.04)",border:ST.editingVar.icon===ic?"2px solid var(--purple)":"2px solid transparent",borderRadius:"8px",padding:"5px 7px",cursor:"pointer",fontSize:"16px"},onClick:()=>{ST.editingVar.icon=ic;render();}});ib.textContent=ic;iWrap.appendChild(ib);});
      wrap.appendChild(iWrap);
      const cWrap=div("",{style:{display:"flex",gap:"6px",flexWrap:"wrap",marginBottom:"14px"}});
      COLORS.forEach(c=>{const cb=el("button","",{style:{width:"26px",height:"26px",borderRadius:"50%",background:c,border:ST.editingVar.color===c?"3px solid #fff":"3px solid transparent",cursor:"pointer"},onClick:()=>{ST.editingVar.color=c;render();}});cWrap.appendChild(cb);});
      wrap.appendChild(cWrap);
      const r3=div("",{style:{display:"flex",gap:"8px"}});
      append(r3,btn("✓ "+L.save,"btn-green",()=>{persistConfig({...ST.config,variable:ST.config.variable.map(x=>x.id===ST.editingVar.id?{...x,...ST.editingVar,budget:Number(ST.editingVar.budget)}:x)});setState({editingVar:null});},{style:{flex:"1",padding:"10px"}}),btn(L.cancel,"btn-danger",()=>setState({editingVar:null}),{style:{padding:"10px 16px"}}));
      wrap.appendChild(r3);vCard.appendChild(wrap);
    } else {
      const vr=div("setting-row");
      const vl=row("",{style:{display:"flex",alignItems:"center",gap:"10px"}});
      vl.appendChild(txt("span","",v.icon,{fontSize:"20px"}));
      const vi=div("");vi.appendChild(txt("p","",v.name,{fontSize:"13px",fontWeight:"600",marginBottom:"2px"}));vi.appendChild(txt("p","",`${v.budget}€`,{fontSize:"11px",color:v.color,fontWeight:"700"}));
      vl.appendChild(vi);
      const vr2=row("",{style:{display:"flex",gap:"6px"}});
      vr2.appendChild(btn("✏","btn-ghost btn-sm",()=>setState({editingVar:{...v}})));
      vr2.appendChild(btn("🗑","btn-danger btn-sm",()=>persistConfig({...ST.config,variable:ST.config.variable.filter(x=>x.id!==v.id)})));
      append(vr,vl,vr2);vCard.appendChild(vr);
    }
  });
  // Add variable
  const avWrap=div("",{style:{borderTop:"1px solid var(--border)",paddingTop:"14px",marginTop:"10px"}});
  avWrap.appendChild(lbl(L.addVar));
  const avRow=div("",{style:{display:"flex",gap:"8px",marginTop:"8px",marginBottom:"10px"}});
  const avn=inp({placeholder:L.namePh,value:ST.newVar.name,style:{flex:"2"}});avn.addEventListener("input",e=>ST.newVar.name=e.target.value);
  const avb=inp({type:"number",placeholder:"€",value:ST.newVar.budget,style:{flex:"1"}});avb.addEventListener("input",e=>ST.newVar.budget=e.target.value);
  append(avRow,avn,avb);avWrap.appendChild(avRow);
  const avI=div("",{style:{display:"flex",flexWrap:"wrap",gap:"6px",marginBottom:"10px"}});
  ICONS.forEach(ic=>{const ib=el("button","",{style:{background:ST.newVar.icon===ic?"rgba(139,92,246,0.3)":"rgba(255,255,255,0.04)",border:ST.newVar.icon===ic?"2px solid var(--purple)":"2px solid transparent",borderRadius:"8px",padding:"5px 7px",cursor:"pointer",fontSize:"16px"},onClick:()=>{ST.newVar.icon=ic;render();}});ib.textContent=ic;avI.appendChild(ib);});
  avWrap.appendChild(avI);
  const avC=div("",{style:{display:"flex",gap:"6px",flexWrap:"wrap",marginBottom:"14px"}});
  COLORS.forEach(c=>{const cb=el("button","",{style:{width:"26px",height:"26px",borderRadius:"50%",background:c,border:ST.newVar.color===c?"3px solid #fff":"3px solid transparent",cursor:"pointer"},onClick:()=>{ST.newVar.color=c;render();}});avC.appendChild(cb);});
  avWrap.appendChild(avC);
  avWrap.appendChild(btn(L.addVar,"btn-primary",()=>{if(!ST.newVar.name.trim()||!ST.newVar.budget)return;persistConfig({...ST.config,variable:[...ST.config.variable,{id:Date.now(),name:ST.newVar.name.trim(),budget:Number(ST.newVar.budget),icon:ST.newVar.icon,color:ST.newVar.color}]});setState({newVar:{name:"",budget:"",icon:"💳",color:"#8B5CF6"}});},{style:{width:"100%",padding:"12px",fontSize:"14px",borderRadius:"14px"}}));
  vCard.appendChild(avWrap);content.appendChild(vCard);
}

try {
  render();
} catch(e) {
  document.getElementById('root').innerHTML = '<div style="padding:20px;color:#ef4444;font-family:monospace;font-size:13px;"><h3>Error:</h3><pre>' + e.message + '</pre><pre>' + e.stack + '</pre></div>';
  console.error('Render error:', e);
}
</script>
</body>
</html>
