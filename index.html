<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BudgetPro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f3ee" id="meta-theme">
<title>BudgetPro</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ================= THEMES (CSS variables) ================= */
:root, body.light{
  --ink:#16241f; --ink-soft:#56655f; --ink-faint:#76837e;
  --paper:#f5f3ee; --card:#ffffff; --card2:#f0ede6; --line:#e2ded4;
  --ring:#2f6f5e; --track:#e2ded4; --plus:#2f6f5e; --minus:#b4472e; --warn:#a06f0e;
  --on-ink:#f5f3ee; --scrim:rgba(10,20,17,.45);
  --radius:14px;
  --sans:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ring2:var(--ring); --grad:none; --glass:rgba(255,255,255,.72);
  --t1:#e7e2f8; --t2:#f3e0f0; --t3:#f8e7dc; --t4:#dde9f8;
}
body.dark, body.night, body.midnight, body.forest, body.ocean, body.rose, body.slate{
  --ink:#eef1ef; --ink-soft:#a3aeaa; --ink-faint:#7f8c87;
  --plus:#5fc4a5; --minus:#e0795c; --warn:#d9a640;
  --on-ink:#121715; --scrim:rgba(0,0,0,.6);
  --glass:rgba(28,32,40,.72);
  --t1:#151a2d; --t2:#23122b; --t3:#2a1c10; --t4:#102235;
}
body.sky{--paper:#f2f3f8;--card:#ffffff;--card2:#e8eef7;--line:#dbe4f0;--ring:#0a84ff;--ring2:#2ec5f5;--track:#d3e3f6;--plus:#0a7ac2;
  --grad:linear-gradient(180deg,#c6dcf5 0,#e3ecf8 380px,#f2f3f8 760px)}
body.night{--paper:#000;--card:#10151d;--card2:#18202c;--line:#222b39;--ring:#1e90ff;--ring2:#38d0ff;--track:#0f2337;
  --grad:linear-gradient(180deg,#0d2236 0,#05090f 460px,#000 800px)}
body.sand{--paper:#f7f1e8;--card:#fffdf9;--card2:#f0e7da;--line:#e6dac8;--ring:#b4692e;--track:#e6dac8}
body.dark    { --paper:#121715; --card:#1b2320; --card2:#222c28; --line:#2c3733; --ring:#5fc4a5; --track:#2c3733; }
body.midnight{ --paper:#0b0e15; --card:#131824; --card2:#192030; --line:#242c3e; --ring:#8da2fb; --track:#242c3e; }
body.forest  { --paper:#0d1511; --card:#14201a; --card2:#1a2a22; --line:#24362c; --ring:#6fcf97; --track:#24362c; }
body.ocean   { --paper:#0b141b; --card:#11202a; --card2:#172a36; --line:#1f3441; --ring:#4cb8ea; --track:#1f3441; }
body.rose    { --paper:#181112; --card:#231a1c; --card2:#2b2023; --line:#3a2a2e; --ring:#f0788c; --track:#3a2a2e; }
body.slate   { --paper:#14161a; --card:#1c1f25; --card2:#242830; --line:#2e323b; --ring:#e8b04a; --track:#2e323b; }

/* ================= BASE ================= */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
body{
  padding-bottom:calc(150px + env(safe-area-inset-bottom));
  background-color:var(--paper);background-image:var(--grad);background-repeat:no-repeat;background-size:100% 900px;color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
html[dir="rtl"] body{font-family:var(--sans)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.wrap{max-width:480px;margin:0 auto;padding:0 20px}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}

/* ================= HEADER ================= */
#app-header{
  position:sticky;top:0;z-index:50;background:transparent;
  padding:calc(12px + env(safe-area-inset-top)) 0 12px;
}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{margin:0;font-size:19px;font-weight:600;letter-spacing:-.3px;line-height:1.2}
.brand-sub{margin:1px 0 0;font-size:12px;color:var(--ink-soft)}
.pill{
  border:1px solid var(--line);background:var(--card);border-radius:12px;
  padding:6px 14px;text-align:center;cursor:pointer;min-width:84px;
}
.pill-l{font-size:11px;color:var(--ink-soft);margin:0;line-height:1.3}
.pill-v{font-size:16px;font-weight:500;margin:0;color:var(--plus)}
.month-wrap{position:relative}
.month-btn{
  display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--glass);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  color:var(--ink);border-radius:999px;padding:7px 16px;font-size:20px;font-weight:400;letter-spacing:-.2px;
}
.month-btn b{font-weight:600}
.month-btn .ico{width:16px;height:16px;stroke-width:2.2;color:var(--ink-soft)}
.days-left{margin:6px 4px 0;font-size:13px;color:var(--ink-soft)}
.gear{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--ink);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);display:inline-flex;align-items:center;justify-content:center;flex:none}
.gear svg,.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hd{align-items:flex-start}
.month-btn:hover{border-color:var(--ink-faint)}
.month-picker{
  position:absolute;top:calc(100% + 6px);inset-inline-start:0;min-width:200px;max-height:260px;overflow:auto;
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;z-index:60;
  box-shadow:0 12px 32px rgba(0,0,0,.14);
}
.month-item{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:0;background:transparent;border-radius:8px;padding:9px 12px;font-size:14px;text-align:start;
}
.month-item:hover{background:var(--card2)}
.month-item.active{background:var(--ink);color:var(--on-ink)}
.dot-now{width:8px;height:8px;border-radius:50%;background:var(--plus);display:inline-block}

/* ================= CONTENT ================= */
#tab-content{padding-top:20px}
.fade-up{animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2{font-size:15px;font-weight:600;margin:0 0 12px}
.page-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 16px}
.page-title h2{margin:0;font-size:17px}
.sub{font-size:12px;color:var(--ink-faint);margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card.tint{background:var(--card2)}
.sec{font-size:13px;font-weight:600;color:var(--ink-soft);margin:0 0 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.row-b{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row-s{display:flex;align-items:center;gap:10px}
.up{color:var(--plus)} .down{color:var(--minus)} .warn{color:var(--warn)}

/* ---- Dial ---- */
.dialwrap{display:flex;justify-content:center;padding:4px 0 6px}
.dial{position:relative;width:216px;height:216px}
.dial svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
.dial circle{fill:none;stroke-linecap:round;stroke-width:12}
.dial .track{stroke:var(--track)}
.dial .prog{transition:stroke-dashoffset .8s cubic-bezier(.22,.9,.3,1),stroke .3s}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.mid .l{font-size:13px;color:var(--ink-soft);margin:0}
.mid .v{font-size:30px;font-weight:500;margin:2px 0;letter-spacing:-.5px}
.mid .s{font-size:12px;color:var(--ink-faint);margin:0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.tile p{margin:0}
.tl{font-size:12px;color:var(--ink-soft)}
.tv{font-size:19px;font-weight:500;margin-top:4px!important}
.pair{margin:18px 0 22px}

/* ---- Home: big dial ---- */
.bigdial{position:relative;width:min(272px,74vw);aspect-ratio:1;margin:8px auto 4px}
.bigdial svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
.bigdial .arc{fill:none;stroke-width:20;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.22,.9,.3,1)}
.bigdial .mid .v{font-size:44px;font-weight:600;letter-spacing:-1px;margin:0;line-height:1.1}
.bigdial .mid .l{font-size:15px;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 26px;text-align:center}
.stat{background:none;border:0;padding:4px 0;color:var(--ink)}
.stat .k{display:flex;align-items:center;justify-content:center;gap:2px;font-size:13px;color:var(--ink-faint);margin:0}
.stat .k .chev{width:13px;height:13px}
.stat .n{font-size:21px;font-weight:400;margin:4px 0 0;letter-spacing:-.3px}
.ins-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 12px}
.ins-h h2{font-size:21px;font-weight:600;margin:0}
.ins{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:26px}
.icard{border-radius:24px;padding:15px 16px 14px;min-height:178px;display:flex;flex-direction:column;border:0;text-align:start;color:var(--ink)}
.icard .ih{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:500;margin:0}
.icard .ih .ico{width:18px;height:18px;color:var(--ink-soft)}
.icard .iv{font-size:25px;font-weight:600;margin:6px 0 0;letter-spacing:-.5px}
.icard .iv small{font-size:16px;font-weight:400;color:var(--ink-soft);margin-inline-start:2px}
.icard .viz{flex:1;display:flex;align-items:center;justify-content:center;min-height:64px;direction:ltr}
.icard .if{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:500;margin:0;min-width:0}
.icard .if span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icard .if .ico{width:18px;height:18px}
.c1{background:var(--t1)} .c2{background:var(--t2)} .c3{background:var(--t3)} .c4{background:var(--t4)}
.catl .li{gap:12px}
.catl .bar{margin-top:7px}

/* ---- floating add button ---- */
.fab{position:fixed;z-index:85;inset-inline-end:max(20px,calc(50vw - 220px));bottom:calc(78px + env(safe-area-inset-bottom));
  display:none;align-items:center;gap:10px;border:1px solid var(--line);border-radius:999px;padding:12px 22px;
  background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);color:var(--ink);
  font-size:18px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.14)}
.fab.on{display:inline-flex}
.fab .ico{width:20px;height:20px;stroke-width:2.2}
.fab:active{transform:scale(.96)}

/* ---- Rail of categories ---- */
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding:0 20px 8px;margin:0 -20px 22px;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.cat{flex:0 0 140px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.cat-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cat-i{font-size:18px;line-height:1}
.cn{font-size:13px;color:var(--ink-soft);margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv{font-size:16px;font-weight:500;margin:0}
.co{font-size:12px;color:var(--ink-faint);margin:2px 0 10px}
.bar{height:5px;border-radius:3px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--ring)}
.bar i.hot{background:var(--minus)}
.bar i.mid2{background:var(--warn)}

/* ---- list rows ---- */
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li-n{font-size:15px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-d{font-size:12px;color:var(--ink-faint);margin:2px 0 0}
.li-a{font-size:15px;font-weight:500;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
.day{font-size:12px;color:var(--ink-faint);margin:16px 2px 6px;letter-spacing:.3px}

/* ---- tables ---- */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;font-weight:500;color:var(--ink-faint);text-align:start;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td.t{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- buttons & inputs ---- */
.btn{
  border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;
  padding:11px 16px;font-size:15px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-solid{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn-ok{background:var(--plus);color:var(--paper);border-color:var(--plus)}
.btn-del{color:var(--minus);border-color:var(--line)}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn-full{width:100%}
.btn-col{flex-direction:column;gap:4px;padding:16px;border-radius:var(--radius);width:100%;background:var(--card)}
.btn-col svg{width:24px;height:24px}
label.lbl{display:block;font-size:13px;color:var(--ink-soft);margin:0 0 6px}
.inp{
  width:100%;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;
  background:var(--paper);color:var(--ink);margin:0;min-width:0;
}
.inp:focus{border-color:var(--ring);outline:0}
select.inp{appearance:auto}
.fld{margin-bottom:14px}
.chip-btn{border:1px solid var(--line);background:var(--card);color:var(--ink-soft);border-radius:999px;padding:6px 12px;font-size:13px}
.empty{text-align:center;padding:40px 16px}
.empty p{color:var(--ink-soft);margin:0 0 16px}

/* ---- settings ---- */
.opt{
  border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 6px;width:100%;
  text-align:center;font-size:12px;color:var(--ink);
}
.opt.on{border-color:var(--ring);box-shadow:0 0 0 1px var(--ring) inset}
.opt .sw{width:18px;height:18px;border-radius:50%;margin:0 auto 6px;border:1px solid var(--line)}
.opt .fl{font-size:22px;margin-bottom:2px}
.picker{display:flex;flex-wrap:wrap;gap:6px}
.pick-i{border:1px solid transparent;background:var(--card2);border-radius:8px;padding:5px 7px;font-size:16px}
.pick-i.on{border-color:var(--ring)}
.pick-c{width:26px;height:26px;border-radius:50%;border:3px solid transparent;padding:0}
.pick-c.on{border-color:var(--ink)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.set-row:last-of-type{border-bottom:0}
.sgrp-t{font-size:12px;font-weight:500;color:var(--ink-faint);margin:18px 6px 6px;letter-spacing:.3px}
.sgrp{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:6px}
.srow{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 16px;text-align:start;font-size:15px;color:var(--ink)}
.sgrp .srow:last-child{border-bottom:0}
.srow:active{background:var(--card2)}
.srow-ic{width:32px;height:32px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none;background:var(--card2);color:var(--ring)}
.srow-ic .ico{width:18px;height:18px}
.srow-l{flex:1;min-width:0}
.srow-v{color:var(--ink-soft);font-size:14px;white-space:nowrap}
.srow-ck{color:var(--ring);font-weight:600;font-size:16px}
.chev{color:var(--ink-faint);width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.th-sw{width:30px;height:30px;border-radius:50%;flex:none;border:1px solid var(--line);position:relative;overflow:hidden}
.th-sw i{position:absolute;inset-inline-end:0;top:0;bottom:0;width:50%}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--ring);font-size:15px;padding:4px 0;margin:0 0 6px}
.back .chev{color:var(--ring);width:18px;height:18px}
.month-item .mi-v{font-size:12px;opacity:.7}
.edit-box{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--card2);display:flex;flex-direction:column;gap:10px}
.add-box{border-top:1px solid var(--line);padding-top:14px;margin-top:8px}

/* ---- analysis / health ---- */
.text-block{font-size:14px;line-height:1.9;white-space:pre-wrap;background:var(--card2);border-radius:12px;padding:14px}
.health{display:flex;align-items:center;gap:16px}
.hring{position:relative;width:64px;height:64px;flex:0 0 auto}
.hring svg{width:100%;height:100%;transform:rotate(-90deg)}
.hring circle{fill:none;stroke-width:4;stroke-linecap:round}
.hring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500;font-family:var(--mono)}
.note{font-size:12px;color:var(--ink-soft);line-height:1.7;margin:0}

/* ================= BOTTOM NAV ================= */
#bottom-nav{
  position:fixed;inset-inline:0;bottom:0;z-index:80;background:var(--glass);border-top:1px solid var(--line);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav-btn{
  background:none;border:0;color:var(--ink-faint);padding:10px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;min-width:0;
}
.nav-btn span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-btn.active{color:var(--ring)}
.nav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ================= TOAST ================= */
#toast-el{
  position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-24px);
  z-index:9999;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:500;color:#fff;
  white-space:nowrap;pointer-events:none;opacity:0;background:var(--ink);
  box-shadow:0 8px 28px rgba(0,0,0,.25);transition:opacity .25s,transform .25s;
}
#toast-el.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:360px){
  .dial{width:190px;height:190px}
  .mid .v{font-size:26px}
  .grid4{grid-template-columns:repeat(3,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  #app-header,#bottom-nav,#toast-el,.no-print{display:none!important}
  body{background:#fff;color:#000;padding:0}
  .card{border-color:#ccc;break-inside:avoid}
}
</style>
</head>
<body class="sky">

<div id="toast-el" role="status" aria-live="polite"></div>

<header id="app-header">
  <div class="wrap">
    <div class="hd">

// ============ STORAGE HELPERS (same keys as the previous version → data is kept) ============
function ls(k,fb){try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch(e){return fb;}}
function lsw(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function pad2(n){return String(n).padStart(2,"0");}
function getMonthKey(d){return d.getFullYear()+"-"+pad2(d.getMonth()+1);}
function localDate(d){return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());}
function getMonthLabel(k){const a=String(k).split("-");const m=parseInt(a[1],10)-1;return (ST.L.months[m]||a[1])+" "+a[0];}

// Display name for a variable category (a custom name wins, otherwise the translated default)
function getCatName(v){
  if(!v)return "";
  if(v.customName)return v.customName;
  if(v.key && VAR_NAMES[v.key]) return VAR_NAMES[v.key][ST.lang]||VAR_NAMES[v.key].en;
  return v.name||"";
}

const now = new Date();
const DEFAULT_FIXED=[{id:1,name:"Fahrkarte ÖPNV",amount:88},{id:2,name:"Internet",amount:25},{id:3,name:"KFZ-Versicherung",amount:81},{id:4,name:"Strom",amount:70},{id:5,name:"Ratenzahlung",amount:95}];

function loadArr(k,fb){const v=ls(k,null);return Array.isArray(v)&&v.length?v:fb;}
function loadNum(k,fb){const v=parseFloat(ls(k,fb));return v>0?v:fb;}
function loadObj(k){const v=ls(k,null);return v&&typeof v==="object"&&!Array.isArray(v)?v:{};}

// ============ STATE ============
const ST = {
  lang: T[ls("bl","ar")]?ls("bl","ar"):"ar",
  theme: THEME_NAMES[ls("bt","sky")]?ls("bt","sky"):"sky",

  showMonthPicker: false,

// ============ MONTHS ============
// Each month keeps its own salary, fixed items and budgets, so editing one month never rewrites another.
// A month without its own copy starts from the latest earlier month (or the old global settings).
ST.monthCfg=loadObj("bm");
function cloneCfg(c){return JSON.parse(JSON.stringify({income:c.income,fixedItems:c.fixedItems,varItems:c.varItems}));}
function cfgFor(k){
  if(ST.monthCfg[k])return cloneCfg(ST.monthCfg[k]);
  const prev=Object.keys(ST.monthCfg).filter(m=>m<k).sort().pop();
  return cloneCfg(prev?ST.monthCfg[prev]:ST.baseCfg);
}
function applyMonth(k){const c=cfgFor(k);ST.income=c.income;ST.fixedItems=c.fixedItems;ST.varItems=c.varItems;}
function initMonths(){
  ST.baseCfg=cloneCfg(ST);
  // months recorded before this feature get frozen with the settings they were made with
  Object.keys(ST.allData).filter(k=>/^\d{4}-\d{2}$/.test(k)&&Array.isArray(ST.allData[k])&&ST.allData[k].length&&!ST.monthCfg[k])
    .forEach(k=>{ST.monthCfg[k]=cloneCfg(ST.baseCfg);});
  applyMonth(ST.selectedMonth);
  saveConfig();
}

// ============ COMPUTED ============
function expenses(){return Array.isArray(ST.allData[ST.selectedMonth])?ST.allData[ST.selectedMonth]:[];}
function totalFixed(){return ST.fixedItems.reduce((s,i)=>s+(+i.amount||0),0);}
function totalVarBudget(){return ST.varItems.reduce((s,i)=>s+(+i.budget||0),0);}
function totalSpent(){return expenses().reduce((s,e)=>s+(+e.amount||0),0);}
function remaining(){return totalVarBudget()-totalSpent();}
function spentCat(id){return expenses().filter(e=>e.catId===id).reduce((s,e)=>s+(+e.amount||0),0);}
function health(){const inc=ST.income||1;return Math.max(0,Math.min(100,Math.round(((ST.income-totalFixed()-totalSpent())/inc)*100*1.5+55)));}
function daysInMonth(k){const a=k.split("-");return new Date(+a[0],+a[1],0).getDate();}
function daysLeft(){return daysInMonth(ST.selectedMonth)-new Date().getDate()+1;}
function monthTotal(k,uptoDay){return (Array.isArray(ST.allData[k])?ST.allData[k]:[]).filter(e=>!uptoDay||parseInt(String(e.date).slice(8,10),10)<=uptoDay).reduce((s,e)=>s+(+e.amount||0),0);}
function prevMonthKey(k){const a=k.split("-");const d=new Date(+a[0],+a[1]-2,1);return getMonthKey(d);}
function allMonths(){return[...new Set([...Object.keys(ST.allData).filter(k=>Array.isArray(ST.allData[k])&&ST.allData[k].length>0),...Object.keys(ST.monthCfg),getMonthKey(now)])].sort((a,b)=>b.localeCompare(a));}

// ============ FORMAT ============
function fmt(n){
  const v=Number(n)||0;
  return v.toLocaleString(ST.lang==="de"?"de-DE":"en-US",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
}
function money(n){return '<span class="num">'+escHtml(fmt(n))+'</span>';}
function escHtml(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}

// ============ PERSIST ============
function saveConfig(){
  ST.monthCfg[ST.selectedMonth]=cloneCfg(ST);lsw("bm",ST.monthCfg);
  // the old global keys follow the current month, as the default for months to come
  if(ST.selectedMonth===getMonthKey(now)){lsw("bi",ST.income);lsw("bf",ST.fixedItems);lsw("bv",ST.varItems);}
}
function saveData(){lsw("bd",ST.allData);}

// ============ TOAST ============
let toastTimer;
function toast(msg,color){
  const el=document.getElementById("toast-el");
  if(!el)return;
  el.textContent=msg;
  el.style.background=color||"";
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{el.classList.remove("show");},2200);
}
const C_OK="#2f6f5e", C_ERR="#b4472e";

// ============ ACTIONS ============
function setLang(lang){if(!T[lang])return;ST.lang=lang;lsw("bl",lang);updateAll();}
function setTheme(theme){if(!THEME_NAMES[theme])return;ST.theme=theme;lsw("bt",theme);updateAll();}
function setTab(i){ST.activeTab=i;if(i!==5)ST.setPage=null;ST.showMonthPicker=false;renderMonthPicker();renderTab();updateNav();}
function setMonth(k){
  ST.selectedMonth=k;ST.showMonthPicker=false;applyMonth(k);
  ST.editingFixed=null;ST.editingVar=null;ST.editIncome=false;ST.reportText="";
  updateHeader();renderTab();
}
function toggleMonthPicker(){ST.showMonthPicker=!ST.showMonthPicker;renderMonthPicker();}

function addExpense(){
  const L=ST.L;
  const desc=(document.getElementById("inp-desc")||{}).value;
  const amount=parseFloat(String((document.getElementById("inp-amount")||{}).value||"").replace(",","."));
  const catId=parseInt((document.getElementById("inp-cat")||{}).value,10);
  const date=(document.getElementById("inp-date")||{}).value||localDate(new Date());
  if(!desc||!desc.trim()){toast("⚠ "+L.descLabel,C_ERR);return;}
  if(!amount||amount<=0){toast("⚠ "+L.amountLabel,C_ERR);return;}
  const cat=ST.varItems.find(v=>v.id===catId)||ST.varItems[0];
  if(!cat){toast("⚠ "+L.catLabel,C_ERR);return;}
  const entry={id:Date.now(),desc:desc.trim(),amount,catId:cat.id,catKey:cat.key||"custom",date};
  if(!Array.isArray(ST.allData[ST.selectedMonth]))ST.allData[ST.selectedMonth]=[];
  ST.allData[ST.selectedMonth].unshift(entry);
  saveData();
  toast("✓ "+L.addExpense,C_OK);
  setTab(0);
}

function deleteExpense(id){
  ST.allData[ST.selectedMonth]=expenses().filter(e=>e.id!==id);
  saveData();
  renderTab(true);
  toast(ST.L.delete);
}

function saveIncome(){
  const val=parseFloat(String((document.getElementById("inp-income")||{}).value||"").replace(",","."));
  if(val>0){ST.income=val;saveConfig();updateHeader();toast("✓ "+ST.L.save,C_OK);}
  ST.editIncome=false;renderTab(true);
}

function addFixed(){
  const name=((document.getElementById("inp-fn")||{}).value||"").trim();
  const amount=parseFloat(String((document.getElementById("inp-fa")||{}).value||"").replace(",","."));
  if(!name||!(amount>0))return;
  ST.fixedItems.push({id:Date.now(),name,amount});
  saveConfig();renderTab(true);toast("✓",C_OK);
}
function delFixed(id){ST.fixedItems=ST.fixedItems.filter(f=>f.id!==id);saveConfig();renderTab(true);}
function saveEditFixed(id){
  const name=((document.getElementById("edf-name-"+id)||{}).value||"").trim();
  const amount=parseFloat(String((document.getElementById("edf-amt-"+id)||{}).value||"").replace(",","."));
  if(!name||!(amount>0))return;
  ST.fixedItems=ST.fixedItems.map(f=>f.id===id?{...f,name,amount}:f);
  saveConfig();ST.editingFixed=null;renderTab(true);toast("✓",C_OK);
}

function addVar(){
  const name=((document.getElementById("inp-vn")||{}).value||"").trim();
  const budget=parseFloat(String((document.getElementById("inp-vb")||{}).value||"").replace(",","."));
  if(!name||!(budget>0))return;
  ST.varItems.push({id:Date.now(),customName:name,key:null,color:ST.newVarColor,icon:ST.newVarIcon,budget});
  saveConfig();renderTab(true);toast("✓",C_OK);
}
function delVar(id){ST.varItems=ST.varItems.filter(v=>v.id!==id);saveConfig();renderTab(true);}
function saveEditVar(id){
  const name=((document.getElementById("edv-name-"+id)||{}).value||"").trim();
  const budget=parseFloat(String((document.getElementById("edv-budget-"+id)||{}).value||"").replace(",","."));
  if(!(budget>0))return;
  ST.varItems=ST.varItems.map(v=>{
    if(v.id!==id)return v;
    const updated={...v,budget};
    if(name&&name!==getCatName(v))updated.customName=name;
    return updated;
  });
  saveConfig();ST.editingVar=null;renderTab(true);toast("✓",C_OK);
}

// Settings sub-pages: push a history entry so the phone's back gesture returns to the list
function openSet(page){ST.setPage=page;try{history.pushState({set:page},"");}catch(e){}renderTab();}
function closeSet(){if(history.state&&history.state.set)history.back();else{ST.setPage=null;renderTab();}}
window.addEventListener("popstate",()=>{if(ST.setPage){ST.setPage=null;if(ST.activeTab===5)renderTab();}});

// re-render a tab without losing what the user already typed
function rerenderKeep(){
  const saved={};
  document.querySelectorAll("#tab-content input[id], #tab-content select[id]").forEach(el=>{saved[el.id]=el.value;});
  renderTab(true);
  Object.keys(saved).forEach(id=>{const el=document.getElementById(id);if(el)el.value=saved[id];});
}
function selectIcon(icon){ST.newVarIcon=icon;rerenderKeep();}
function selectColor(color){ST.newVarColor=color;rerenderKeep();}
function selectEditIcon(id,icon){ST.varItems=ST.varItems.map(v=>v.id===id?{...v,icon}:v);saveConfig();rerenderKeep();}
function selectEditColor(id,color){ST.varItems=ST.varItems.map(v=>v.id===id?{...v,color}:v);saveConfig();rerenderKeep();}
function startEditFixed(id){ST.editingFixed=id;rerenderKeep();}
function cancelEditFixed(){ST.editingFixed=null;rerenderKeep();}
function startEditVar(id){ST.editingVar=id;rerenderKeep();}
function cancelEditVar(){ST.editingVar=null;rerenderKeep();}
function toggleEditIncome(){ST.editIncome=!ST.editIncome;rerenderKeep();}

// The AI calls go through Claude's sandbox proxy, so they only work when the page runs inside Claude.
const AI_ON=/(^|\.)(claude\.ai|claudeusercontent\.com)$/.test(location.hostname);

async function generateReport(){
  if(!AI_ON)return;
  ST.reportLoading=true;ST.reportText="";renderTab(true);
  const L=ST.L;
  const rows=ST.varItems.map(v=>getCatName(v)+": "+v.budget+"€/"+spentCat(v.id).toFixed(2)+"€").join(", ");
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1200,messages:[{role:"user",content:L.prompt(getMonthLabel(ST.selectedMonth),ST.income,totalFixed(),totalSpent().toFixed(2),remaining().toFixed(2),rows)}]})});
    const data=await res.json();
    ST.reportText=(data.content&&data.content.map(i=>i.text||"").join(""))||"Error";
  }catch(e){ST.reportText="Error. Try again.";}
  ST.reportLoading=false;renderTab(true);
}

async function sendGmail(){
  if(!AI_ON)return;
  ST.gmailStatus="loading";renderTab(true);
  const L=ST.L;
  const body="BudgetPro — "+getMonthLabel(ST.selectedMonth)+"\n\n"+L.salary+": "+ST.income+"€ | "+L.fixed+": "+totalFixed()+"€ | "+L.spent+": "+totalSpent().toFixed(2)+"€ | "+L.remaining+": "+remaining().toFixed(2)+"€\n\n"+
    ST.varItems.map(v=>"• "+getCatName(v)+": "+v.budget+"€ / "+spentCat(v.id).toFixed(2)+"€ "+(spentCat(v.id)>v.budget?"⚠":"✓")).join("\n")+"\n\n"+
    expenses().slice(0,20).map(e=>"• "+e.date+" | "+e.desc+" | "+e.amount+"€").join("\n");
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:200,mcp_servers:[{type:"url",url:"https://gmailmcp.googleapis.com/mcp/v1",name:"gmail"}],messages:[{role:"user",content:'Create Gmail draft: subject="BudgetPro — '+getMonthLabel(ST.selectedMonth)+'", body: '+body+'. Reply: SUCCESS or FAILED'}]})});
    const data=await res.json();
    const t=data.content&&data.content.find(b=>b.type==="text");
    ST.gmailStatus=(t&&String(t.text).toLowerCase().includes("success"))?"success":"error";
  }catch(e){ST.gmailStatus="error";}
  setTimeout(()=>{ST.gmailStatus="";if(ST.activeTab===4)renderTab(true);},4000);
  renderTab(true);
}

function exportExcel(){
  const L=ST.L;
  if(typeof XLSX==="undefined"){toast("⚠ Excel (offline)",C_ERR);return;}
  const wb=XLSX.utils.book_new();
  const entries=expenses().map(e=>{const cat=ST.varItems.find(v=>v.id===e.catId);return{...e,catName:getCatName(cat||{}),soll:ACCOUNT_MAP[e.catKey||"custom"]||"6800",haben:"1200"};});
  const ws1=XLSX.utils.aoa_to_sheet([[L.dateLabel,L.descLabel,L.catLabel,L.debit,L.credit,"€"],...entries.map(e=>[e.date,e.desc,e.catName,e.soll,e.haben,(+e.amount).toFixed(2)])]);
  ws1["!cols"]=[{wch:12},{wch:30},{wch:20},{wch:10},{wch:10},{wch:12}];
  XLSX.utils.book_append_sheet(wb,ws1,String(L.journal).replace(/[\\\/\?\*\[\]:]/g,"").slice(0,31));
  const ws2=XLSX.utils.aoa_to_sheet([[L.assets,"",L.liabilities,""],[L.salary,ST.income+"€",L.fixedExp,totalFixed()+"€"],[L.varBudgets,totalVarBudget()+"€",L.spent,totalSpent().toFixed(2)+"€"]]);
  XLSX.utils.book_append_sheet(wb,ws2,String(L.balance).replace(/[\\\/\?\*\[\]:]/g,"").slice(0,31));
  XLSX.writeFile(wb,"BudgetPro_"+getMonthLabel(ST.selectedMonth).replace(/\s+/g,"_")+".xlsx");
  toast("✓ Excel",C_OK);
}

function exportDATEV(){
  const entries=expenses().map(e=>({...e,soll:ACCOUNT_MAP[e.catKey||"custom"]||"6800",haben:"1200"}));
  const q=s=>String(s).replace(/"/g,'""');
  const csv='"Umsatz";"Soll/Haben";"WKZ Umsatz";"Konto";"Gegenkonto";"Belegdatum";"Buchungstext"\n'+
    entries.map(e=>'"'+(+e.amount).toFixed(2)+'";"S";"EUR";"'+e.soll+'";"'+e.haben+'";"'+String(e.date).split("-").reverse().join("")+'";"'+q(e.desc)+'"').join("\n");
  const url=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8;"}));
  const a=document.createElement("a");
  a.href=url;a.download="DATEV_"+getMonthLabel(ST.selectedMonth).replace(/\s+/g,"_")+".csv";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  toast("✓ DATEV",C_OK);
}

function chev(back){const rtl=ST.L.dir==="rtl";const right=back?rtl:!rtl;
  return '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="'+(right?"M9 6l6 6-6 6":"M15 6l-6 6 6 6")+'"/></svg>';}

// ============ TAB RENDERS ============
function renderTab(keep){
  const content=document.getElementById("tab-content");
  if(!content)return;
  if(!keep)window.scrollTo(0,0);
  const L=ST.L;
  const fns=[renderDashboard,renderAdd,renderHistory,renderAccounting,renderReport,renderSettings];
  content.innerHTML=(fns[ST.activeTab]||renderDashboard)(L);
  content.className=keep?"":"fade-up";
  const pr=content.querySelector(".prog[data-off]");
  if(pr){void pr.getBoundingClientRect();pr.style.strokeDashoffset=pr.getAttribute("data-off");}
}

function pageTitle(L,i,extra){
  return '<div class="page-title"><div><h2>'+escHtml(L.tabs[i])+'</h2><p class="sub">'+escHtml(getMonthLabel(ST.selectedMonth))+'</p></div>'+(extra||"")+'</div>';
}

// ---------- 0 · DASHBOARD ----------
function renderDashboard(L){
  const tf=totalFixed(),ts=totalSpent(),rem=remaining(),tb=totalVarBudget();
  const k=ST.selectedMonth,cur=getMonthKey(new Date()),nDays=daysInMonth(k);
  const today=k<cur?nDays+1:k>cur?0:new Date().getDate();
  const frac=tb>0?Math.max(0,Math.min(1,rem/tb)):0;

  // dial: outer arc = budget left, inner dots = days of the month (lit = still ahead)
  const R=112,C=2*Math.PI*R,gid="g"+Date.now();
  let dots="";
  for(let i=0;i<nDays;i++){
    const a=i/nDays*2*Math.PI,x=136+84*Math.cos(a),y=136+84*Math.sin(a),ahead=i+1>=today;
    dots+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="2.6" style="fill:'+(ahead?"var(--ring)":"var(--ink-faint)")+';opacity:'+(ahead?1:.35)+'"></circle>';
  }
  const dial='<div class="bigdial">'+
    '<svg viewBox="0 0 272 272" role="img" aria-label="'+escHtml(L.leftToSpend+": "+fmt(rem))+'">'+
      '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--ring)"/><stop offset="1" style="stop-color:var(--ring2)"/></linearGradient></defs>'+
      '<circle class="arc" cx="136" cy="136" r="'+R+'" style="stroke:var(--track)"></circle>'+
      '<circle class="arc prog" cx="136" cy="136" r="'+R+'" stroke-dasharray="'+C.toFixed(1)+'" style="stroke:'+(rem<0?"var(--minus)":"url(#"+gid+")")+';stroke-dashoffset:'+C.toFixed(1)+'" data-off="'+(C*(1-frac)).toFixed(1)+'"></circle>'+
      dots+
    '</svg>'+
    '<div class="mid"><p class="v num'+(rem<0?" down":"")+'">'+escHtml(fmtInt(Math.round(rem)))+'</p><p class="l">'+escHtml(L.leftToSpend)+'</p></div>'+
  '</div>';

  const stat=(label,val,onclick)=>'<button type="button" class="stat" onclick="'+onclick+'"><p class="k">'+escHtml(label)+''+chev()+'</p><p class="n num">'+escHtml(fmtInt(Math.round(val)))+'</p></button>';
  const stats='<div class="stats">'+
    stat(L.salary,ST.income,"setTab(5);openSet('salary')")+
    stat(L.fixed,tf,"setTab(5);openSet('fixed')")+
    stat(L.spent,ts,"setTab(2)")+
  '</div>';

  // Trend: spending so far vs the same point last month
  const day=k===cur?new Date().getDate():0;
  const prev=monthTotal(prevMonthKey(k),day);
  const diff=prev>0?Math.round((ts-prev)/prev*100):null;
  const tState=diff===null?"none":diff<0?"down":diff>0?"up":"same";
  const daily=new Array(nDays).fill(0);
  expenses().forEach(e=>{const d=parseInt(String(e.date).slice(8,10),10);if(d>=1&&d<=nDays)daily[d-1]+=(+e.amount||0);});
  const upto=Math.max(1,Math.min(nDays,k===cur?today:k<cur?nDays:1));
  let acc=0;const cum=daily.slice(0,upto).map(v=>acc+=v);
  const maxY=Math.max(1,acc),W=140,H=56;
  const pts=cum.map((v,i)=>[(upto>1?i/(upto-1):1)*(W-6)+3,H-4-(v/maxY)*(H-10)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("");
  const last=pts[pts.length-1];
  const spark='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" aria-hidden="true">'+
    '<path d="'+line+'L'+last[0].toFixed(1)+' '+H+'L3 '+H+'Z" style="fill:var(--ring2);opacity:.14"></path>'+
    '<path d="'+line+'" style="fill:none;stroke:var(--ring2);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round"></path>'+
    '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="4" style="fill:var(--ring2)"></circle></svg>';
  const trendCard='<div class="icard c1"><p class="ih">'+ico("trend")+escHtml(L.trend)+'</p>'+
    '<p class="iv num">'+(diff===null?"—":(diff>0?"+":"")+diff+'<small>%</small>')+'</p>'+
    '<div class="viz">'+spark+'</div>'+
    '<p class="if">'+(tState==="none"?"":ico(tState==="up"?"up":"down"))+'<span>'+escHtml(tState==="down"?L.trendDown:tState==="up"?L.trendUp:tState==="same"?L.trendSame:L.noCompare)+'</span></p></div>';

  // Top spending: donut split by category
  const cats=ST.varItems.map(v=>({v,s:spentCat(v.id)})).filter(c=>c.s>0).sort((a,b)=>b.s-a.s);
  const top=cats[0],DR=30,DC=2*Math.PI*DR,gap=cats.length>1?5:0;
  let off=0,segs="";
  cats.forEach(c=>{const len=Math.max(0.5,c.s/ts*DC-gap);
    segs+='<circle cx="40" cy="40" r="'+DR+'" style="fill:none;stroke:'+safeColor(c.v.color)+';stroke-width:13" stroke-dasharray="'+len.toFixed(1)+' '+DC.toFixed(1)+'" stroke-dashoffset="'+(-off).toFixed(1)+'"></circle>';
    off+=c.s/ts*DC;});
  const donut='<svg viewBox="0 0 80 80" width="82" height="82" style="transform:rotate(-90deg)" aria-hidden="true">'+
    '<circle cx="40" cy="40" r="'+DR+'" style="fill:none;stroke:var(--track);stroke-width:13;opacity:'+(cats.length?0:1)+'"></circle>'+segs+'</svg>';
  const topCard='<button type="button" class="icard c2" onclick="setTab(4)"><p class="ih">'+ico("pie")+escHtml(L.topSpending)+'</p>'+
    '<p class="iv num">'+(top?escHtml(fmtInt(Math.round(top.s))):"—")+'</p>'+
    '<div class="viz">'+donut+'</div>'+
    '<p class="if"><span class="dot" style="background:'+(top?safeColor(top.v.color):"var(--ink-faint)")+'"></span><span>'+escHtml(top?getCatName(top.v):L.noSpend)+'</span></p></button>';

  // Planned: fixed costs as small bars
  const fx=ST.fixedItems.slice().sort((a,b)=>(+b.amount||0)-(+a.amount||0)).slice(0,7);
  const fmax=Math.max(1,...fx.map(f=>+f.amount||0));
  const bars='<svg viewBox="0 0 140 56" width="100%" height="56" aria-hidden="true">'+fx.map((f,i)=>{
    const h=Math.max(4,(+f.amount||0)/fmax*48),bw=Math.min(14,120/Math.max(1,fx.length)-6),x=10+i*(bw+6);
    return '<rect x="'+x.toFixed(1)+'" y="'+(54-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="4" style="fill:var(--warn);opacity:'+(1-i*0.09).toFixed(2)+'"></rect>';}).join("")+'</svg>';
  const planCard='<button type="button" class="icard c3" onclick="setTab(5);openSet(\'fixed\')"><p class="ih">'+ico("cal")+escHtml(L.planned)+'</p>'+
    '<p class="iv num">'+escHtml(fmtInt(Math.round(tf)))+'</p>'+
    '<div class="viz">'+bars+'</div>'+
    '<p class="if"><span>'+escHtml(ST.fixedItems.length+" "+L.itemsN)+'</span></p></button>';

  // Savings: share of salary not spent
  const saved=ST.income-tf-ts,rate=ST.income>0?Math.round(saved/ST.income*100):0;
  const SR=26,SC=2*Math.PI*SR,sp=Math.max(0,Math.min(1,rate/100));
  const ring='<svg viewBox="0 0 70 70" width="74" height="74" style="transform:rotate(-90deg)" aria-hidden="true">'+
    '<circle cx="35" cy="35" r="'+SR+'" style="fill:none;stroke:var(--track);stroke-width:9"></circle>'+
    '<circle cx="35" cy="35" r="'+SR+'" stroke-dasharray="'+(sp*SC).toFixed(1)+' '+SC.toFixed(1)+'" style="fill:none;stroke:'+(rate<0?"var(--minus)":"var(--plus)")+';stroke-width:9;stroke-linecap:round"></circle></svg>';
  const saveCard='<div class="icard c4"><p class="ih">'+ico("target")+escHtml(L.savings)+'</p>'+
    '<p class="iv num'+(rate<0?" down":"")+'">'+(rate>0?"+":"")+rate+'<small>%</small></p>'+
    '<div class="viz">'+ring+'</div>'+
    '<p class="if"><span class="num">'+escHtml(fmtInt(Math.round(saved)))+'</span><span>'+escHtml(L.saved)+'</span></p></div>';

  const catRows=ST.varItems.map(v=>{
    const sp=spentCat(v.id),b=+v.budget||0,p=b>0?Math.min(sp/b*100,100):(sp>0?100:0),over=sp>b;
    return '<div class="li"><span style="font-size:20px;flex:none">'+escHtml(v.icon)+'</span>'+
      '<div style="flex:1;min-width:0"><div class="row-b"><p class="li-n">'+escHtml(getCatName(v))+'</p>'+
      '<span class="li-a num'+(over?" down":"")+'" style="font-size:14px">'+escHtml(fmtInt(Math.round(sp)))+' <span style="color:var(--ink-faint);font-weight:400">/ '+escHtml(fmtInt(Math.round(b)))+'</span></span></div>'+
      '<div class="bar"><i class="'+(over?"hot":"")+'" style="'+(over?"":"background:"+safeColor(v.color)+";")+'width:'+p.toFixed(0)+'%"></i></div></div></div>';
  }).join("");

  return dial+stats+
    '<div class="ins-h"><h2>'+escHtml(L.insights)+'</h2></div>'+
    '<div class="ins">'+trendCard+topCard+planCard+saveCard+'</div>'+
    '<div class="ins-h"><h2>'+escHtml(L.catBudgets)+'</h2></div>'+
    '<div class="card catl">'+catRows+'</div>';
}

// ---------- 1 · ADD ----------

  const catOptions=ST.varItems.map(v=>'<option value="'+nid(v.id)+'">'+escHtml(v.icon)+' '+escHtml(getCatName(v))+'</option>').join("");
  return pageTitle(L,1,'<button type="button" class="btn btn-sm" onclick="setTab(0)">'+escHtml(L.cancel)+'</button>')+
  '<div class="card">'+
    '<div class="fld"><label class="lbl" for="inp-desc">'+escHtml(L.descLabel)+'</label>'+
      '<input id="inp-desc" class="inp" type="text" placeholder="'+escHtml(L.descPh)+'" autocomplete="off" autocorrect="off" spellcheck="false"></div>'+
    '<div class="fld"><label class="lbl" for="inp-amount">'+escHtml(L.amountLabel)+'</label>'+

}

// ---------- 2 · HISTORY ----------
function renderHistory(L){
  const exps=expenses();
  if(!exps.length)return pageTitle(L,2)+
    '<div class="card empty"><p>'+escHtml(L.noExpenses)+'</p>'+
    '<button type="button" class="btn btn-solid" onclick="setTab(1)">'+escHtml(L.addFirst)+'</button></div>';

  const grouped={};
  exps.forEach(e=>{const d=String(e.date||"");(grouped[d]=grouped[d]||[]).push(e);});
  let html=pageTitle(L,2,'<span class="chip-btn num" style="cursor:default">'+exps.length+' '+escHtml(L.ops)+' · '+escHtml(fmt(totalSpent()))+'</span>');
  Object.keys(grouped).sort((a,b)=>b.localeCompare(a)).forEach(date=>{
    html+='<p class="day num">'+escHtml(date)+'</p><div class="card" style="padding:4px 16px">';
    grouped[date].forEach(e=>{
      const cat=ST.varItems.find(v=>v.id===e.catId);
      html+='<div class="li"><div style="min-width:0;flex:1">'+
        '<p class="li-n">'+escHtml(e.desc)+'</p>'+
        '<p class="li-d"><span class="dot" style="background:'+safeColor(cat&&cat.color)+';margin-inline-end:6px"></span>'+escHtml((cat?cat.icon+" ":"")+getCatName(cat||{}))+'</p></div>'+
        '<div class="row-s" style="flex-shrink:0"><span class="li-a down">−'+money(e.amount)+'</span>'+
        '<button type="button" class="btn btn-del btn-sm" onclick="deleteExpense('+nid(e.id)+')" aria-label="'+escHtml(L.delete)+'">✕</button></div></div>';
    });
    html+='</div>';
  });
  return html;
}

// ---------- 3 · ACCOUNTING ----------
function renderAccounting(L){
  const entries=expenses().map(e=>({...e,soll:ACCOUNT_MAP[e.catKey||"custom"]||"6800",haben:"1200"}));
  const rows=entries.length?entries.map(e=>
    '<tr><td class="n" style="color:var(--ink-faint)">'+escHtml(e.date)+'</td>'+
    '<td class="t">'+escHtml(e.desc)+'</td>'+
    '<td class="n down">'+e.soll+'</td><td class="n up">'+e.haben+'</td>'+
    '<td class="n">'+escHtml(fmt(e.amount))+'</td></tr>').join("")
    :'<tr><td colspan="5" style="text-align:center;color:var(--ink-faint);padding:22px">'+escHtml(L.noExpenses)+'</td></tr>';
  const tf=totalFixed(),ts=totalSpent();
  const brow=(l,v,cls)=>'<div class="row-b" style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="sub">'+escHtml(l)+'</span><span class="li-a '+cls+'" style="font-size:13px">'+money(v)+'</span></div>';
  return pageTitle(L,3)+
  '<div class="grid2" style="margin-bottom:14px">'+
    '<button type="button" class="btn btn-col" onclick="exportExcel()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4zM4 9h16M4 14h16M10 4v16"/></svg>'+escHtml(L.exportExcel)+'</button>'+
    '<button type="button" class="btn btn-col" onclick="exportDATEV()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>'+escHtml(L.exportDATEV)+'</button>'+
  '</div>'+
  '<div class="card tint"><p class="sec" style="margin-bottom:6px">DATEV · SAP</p><p class="note">'+escHtml(L.datevInfo)+'</p></div>'+
  '<div class="card"><p class="sec">'+escHtml(L.journal)+'</p><div class="tbl-wrap"><table class="tbl"><thead><tr>'+
    '<th>'+escHtml(L.dateLabel)+'</th><th>'+escHtml(L.descLabel)+'</th><th>'+escHtml(L.debit)+'</th><th>'+escHtml(L.credit)+'</th><th>€</th>'+
  '</tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
  '<div class="card"><p class="sec">'+escHtml(L.balance)+'</p><div class="grid2">'+
    '<div><p class="sec up" style="margin-bottom:6px">'+escHtml(L.assets)+'</p>'+
      brow(L.salary,ST.income,"up")+brow(L.varBudgets,totalVarBudget(),"up")+
      '<div class="row-b" style="padding-top:8px"><span style="font-size:13px;font-weight:500">'+escHtml(L.total)+'</span><span class="li-a up">'+money(ST.income+totalVarBudget())+'</span></div></div>'+
    '<div><p class="sec down" style="margin-bottom:6px">'+escHtml(L.liabilities)+'</p>'+
      brow(L.fixedExp,tf,"down")+brow(L.spent,ts,"down")+
      '<div class="row-b" style="padding-top:8px"><span style="font-size:13px;font-weight:500">'+escHtml(L.total)+'</span><span class="li-a down">'+money(tf+ts)+'</span></div></div>'+
  '</div></div>';
}

// ---------- 4 · REPORT ----------
function renderReport(L){
  const gs=ST.gmailStatus;
  const gmailLabel=gs==="loading"?L.sending:gs==="success"?L.ok:gs==="error"?L.err:L.send;
  const aiOff=AI_ON?"":'<p class="note" style="margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--card2);border:1px dashed var(--line)">ⓘ '+escHtml(L.aiOff)+'</p>';
  const analysis=ST.reportLoading
    ?'<div class="empty" style="padding:28px"><p style="margin:0">'+escHtml(L.analyzing)+'</p></div>'
    :!ST.reportText
    ?'<button type="button" class="btn btn-solid btn-full no-print" onclick="generateReport()">'+escHtml(L.generate)+'</button>'
    :'<div class="text-block">'+escHtml(ST.reportText)+'</div>';
  const sum=[[L.salary,ST.income,"up"],[L.fixedExp,totalFixed(),"warn"],[L.spent,totalSpent(),"down"],[L.remaining,remaining(),remaining()>=0?"up":"down"]]
    .map(r=>'<div class="tile" style="background:var(--card2)"><p class="tl">'+escHtml(r[0])+'</p><p class="tv '+r[2]+'">'+money(r[1])+'</p></div>').join("");
  const detail=ST.varItems.map(v=>{
    const s=spentCat(v.id),r=(+v.budget||0)-s;
    return '<tr><td>'+escHtml(v.icon)+' '+escHtml(getCatName(v))+'</td><td class="n" style="color:var(--ink-faint)">'+escHtml(fmt(v.budget))+'</td>'+
      '<td class="n down">'+escHtml(fmt(s))+'</td><td class="n '+(r>=0?"up":"down")+'">'+escHtml(fmt(r))+'</td>'+
      '<td style="font-size:12px">'+escHtml(r>=0?L.within:L.exceeded)+'</td></tr>';
  }).join("");
  return pageTitle(L,4,
    '<div class="row-s no-print">'+(AI_ON?'<button type="button" class="btn btn-sm" onclick="generateReport()">'+escHtml(L.refresh)+'</button>':"")+
    '<button type="button" class="btn btn-solid btn-sm" onclick="window.print()">'+escHtml(L.pdf)+'</button></div>')+
  '<div class="card no-print"><div class="row-b"><div><p style="margin:0;font-size:15px;font-weight:500">'+escHtml(L.gmail)+'</p><p class="sub">'+escHtml(L.gmailDesc)+'</p></div>'+
    '<button type="button" class="btn btn-sm" onclick="sendGmail()"'+(gs==="loading"||!AI_ON?" disabled":"")+'>'+escHtml(gmailLabel)+'</button></div>'+
    (gs==="success"?'<p class="note up" style="margin-top:10px">'+escHtml(L.gmailDone)+'</p>':"")+
    (gs==="error"?'<p class="note down" style="margin-top:10px">'+escHtml(L.gmailFail)+'</p>':"")+aiOff+
  '</div>'+
  '<div class="card"><p class="sec">'+escHtml(L.summary)+'</p><div class="grid2" style="margin-bottom:18px">'+sum+'</div>'+
    '<p class="sec">'+escHtml(L.details)+'</p><div class="tbl-wrap" style="margin-bottom:18px"><table class="tbl"><thead><tr>'+
      '<th>'+escHtml(L.catLabel)+'</th><th>'+escHtml(L.budget)+'</th><th>'+escHtml(L.spent)+'</th><th>'+escHtml(L.remaining)+'</th><th>'+escHtml(L.status)+'</th>'+
    '</tr></thead><tbody>'+detail+'</tbody></table></div>'+
    (AI_ON?'<p class="sec">'+escHtml(L.analysis)+'</p>'+analysis:"")+
  '</div>';
}

// ---------- 5 · SETTINGS ----------
function renderSettings(L){
  const LANGS=[["ar","العربية","AR"],["en","English","EN"],["de","Deutsch","DE"]];
  const themeName=k=>(THEME_NAMES[k]||{})[ST.lang]||THEME_NAMES[k].en;
  const check=on=>on?'<span class="srow-ck" aria-hidden="true">✓</span>':"";
  const row=(icon,label,value,page)=>'<button type="button" class="srow" onclick="openSet(\''+page+'\')">'+
    '<span class="srow-ic">'+icon+'</span><span class="srow-l">'+escHtml(label)+'</span><span class="srow-v">'+value+'</span>'+chev()+'</button>';
  const themeRows=keys=>keys.map(k=>'<button type="button" class="srow" onclick="setTheme(\''+k+'\')"'+(ST.theme===k?' aria-current="true"':"")+'>'+
    '<span class="th-sw" style="background:'+THEME_BG[k]+'"><i style="background:'+THEME_ACCENT[k]+'"></i></span>'+
    '<span class="srow-l">'+escHtml(themeName(k))+'</span>'+check(ST.theme===k)+'</button>').join("");
  const langRows=LANGS.map(a=>'<button type="button" class="srow" onclick="setLang(\''+a[0]+'\')"'+(ST.lang===a[0]?' aria-current="true"':"")+'>'+
    '<span class="srow-ic">'+a[2]+'</span><span class="srow-l">'+a[1]+'</span>'+check(ST.lang===a[0])+'</button>').join("");

  const iconPick=(sel,fn)=>ICONS.map(ic=>'<button type="button" class="pick-i'+(sel===ic?" on":"")+'" onclick="'+fn(ic)+'">'+ic+'</button>').join("");
  const colorPick=(sel,fn)=>COLORS.map(c=>'<button type="button" class="pick-c'+(sel===c?" on":"")+'" style="background:'+c+'" onclick="'+fn(c)+'" aria-label="'+c+'"></button>').join("");

  const fixedRows=ST.fixedItems.map(f=>{
    const id=nid(f.id);
    if(ST.editingFixed===f.id)return '<div class="edit-box"><div class="row-s">'+
      '<input id="edf-name-'+id+'" class="inp" style="flex:2" value="'+escHtml(f.name)+'">'+
      '<input id="edf-amt-'+id+'" class="inp" type="number" step="0.01" inputmode="decimal" style="flex:1" value="'+escHtml(f.amount)+'"></div>'+
      '<div class="row-s"><button type="button" class="btn btn-ok" style="flex:1" onclick="saveEditFixed('+id+')">✓ '+escHtml(L.save)+'</button>'+
      '<button type="button" class="btn" onclick="cancelEditFixed()">'+escHtml(L.cancel)+'</button></div></div>';
    return '<div class="set-row"><div class="row-s" style="min-width:0"><span class="dot" style="background:var(--warn)"></span>'+
      '<span style="font-size:14px;overflow:hidden;text-overflow:ellipsis">'+escHtml(f.name)+' <span class="warn">('+money(f.amount)+')</span></span></div>'+
      '<div class="row-s"><button type="button" class="btn btn-sm" onclick="startEditFixed('+id+')">'+escHtml(L.edit)+'</button>'+
      '<button type="button" class="btn btn-del btn-sm" onclick="delFixed('+id+')" aria-label="'+escHtml(L.delete)+'">✕</button></div></div>';
  }).join("");

  const varRows=ST.varItems.map(v=>{
    const id=nid(v.id);
    if(ST.editingVar===v.id)return '<div class="edit-box"><div class="row-s">'+
      '<input id="edv-name-'+id+'" class="inp" style="flex:2" value="'+escHtml(getCatName(v))+'" placeholder="'+escHtml(L.namePh)+'">'+
      '<input id="edv-budget-'+id+'" class="inp" type="number" step="0.01" inputmode="decimal" style="flex:1" value="'+escHtml(v.budget)+'"></div>'+
      '<div class="picker">'+iconPick(v.icon,ic=>"selectEditIcon("+id+",'"+ic+"')")+'</div>'+
      '<div class="picker">'+colorPick(v.color,c=>"selectEditColor("+id+",'"+c+"')")+'</div>'+
      '<div class="row-s"><button type="button" class="btn btn-ok" style="flex:1" onclick="saveEditVar('+id+')">✓ '+escHtml(L.save)+'</button>'+
      '<button type="button" class="btn" onclick="cancelEditVar()">'+escHtml(L.cancel)+'</button></div></div>';
    return '<div class="set-row"><div class="row-s" style="min-width:0"><span style="font-size:20px">'+escHtml(v.icon)+'</span>'+
      '<div style="min-width:0"><p class="li-n" style="font-size:14px">'+escHtml(getCatName(v))+'</p>'+
      '<p class="li-d" style="color:'+safeColor(v.color)+'">'+money(v.budget)+'</p></div></div>'+
      '<div class="row-s"><button type="button" class="btn btn-sm" onclick="startEditVar('+id+')">'+escHtml(L.edit)+'</button>'+
      '<button type="button" class="btn btn-del btn-sm" onclick="delVar('+id+')" aria-label="'+escHtml(L.delete)+'">✕</button></div></div>';
  }).join("");

  const incomeSection=ST.editIncome
    ?'<div class="row-s" style="margin-top:12px"><input id="inp-income" class="inp" type="number" step="0.01" inputmode="decimal" style="flex:1" value="'+escHtml(ST.income)+'">'+
      '<button type="button" class="btn btn-ok" onclick="saveIncome()">'+escHtml(L.save)+'</button></div>'
    :'<p class="num up" style="font-size:26px;font-weight:500;margin:8px 0 0">'+escHtml(fmt(ST.income))+'</p>';

  const monthNote='<p class="note" style="margin:0 6px 14px">'+escHtml(L.monthNote.replace("{m}",getMonthLabel(ST.selectedMonth)))+'</p>';
  const sub=(title,html,withNote)=>'<button type="button" class="back" onclick="closeSet()">'+chev(true)+''+escHtml(L.tabs[5])+'</button>'+
    '<div class="page-title"><div><h2>'+escHtml(title)+'</h2>'+(withNote?'<p class="sub">'+escHtml(getMonthLabel(ST.selectedMonth))+'</p>':"")+'</div></div>'+(withNote?monthNote:"")+html;
  const pg=ST.setPage;

  if(pg==="lang")return sub(L.language,'<div class="sgrp">'+langRows+'</div>');
  if(pg==="theme")return sub(L.theme,
    '<p class="sgrp-t">'+escHtml(L.lightThemes)+'</p><div class="sgrp">'+themeRows(LIGHT_THEMES)+'</div>'+
    '<p class="sgrp-t">'+escHtml(L.darkThemes)+'</p><div class="sgrp">'+themeRows(Object.keys(THEME_NAMES).filter(k=>!LIGHT_THEMES.includes(k)))+'</div>');
  if(pg==="salary")return sub(L.monthlySalary,'<div class="card"><div class="row-b"><p class="sec" style="margin:0">'+escHtml(L.monthlySalary)+'</p>'+
    '<button type="button" class="btn btn-sm" onclick="toggleEditIncome()">'+escHtml(ST.editIncome?L.cancel:L.edit)+'</button></div>'+incomeSection+'</div>',true);
  if(pg==="fixed")return sub(L.fixedCats,'<div class="card">'+fixedRows+
    '<div class="add-box"><label class="lbl" for="inp-fn">'+escHtml(L.addFixed)+'</label><div class="row-s">'+
      '<input id="inp-fn" class="inp" style="flex:2" placeholder="'+escHtml(L.namePh)+'">'+
      '<input id="inp-fa" class="inp" type="number" step="0.01" inputmode="decimal" style="flex:1" placeholder="€">'+
      '<button type="button" class="btn btn-solid" onclick="addFixed()">'+escHtml(L.add)+'</button></div></div></div>',true);
  if(pg==="var")return sub(L.varCats,'<div class="card">'+varRows+
    '<div class="add-box"><label class="lbl" for="inp-vn">'+escHtml(L.addVar)+'</label><div class="row-s" style="margin-bottom:12px">'+
      '<input id="inp-vn" class="inp" style="flex:2" placeholder="'+escHtml(L.namePh)+'">'+
      '<input id="inp-vb" class="inp" type="number" step="0.01" inputmode="decimal" style="flex:1" placeholder="€"></div>'+
      '<div class="picker" style="margin-bottom:12px">'+iconPick(ST.newVarIcon,ic=>"selectIcon('"+ic+"')")+'</div>'+
      '<div class="picker" style="margin-bottom:14px">'+colorPick(ST.newVarColor,c=>"selectColor('"+c+"')")+'</div>'+
      '<button type="button" class="btn btn-solid btn-full" onclick="addVar()">'+escHtml(L.addVar)+'</button></div></div>',true);

  const langName=(LANGS.find(a=>a[0]===ST.lang)||LANGS[0])[1];
  return pageTitle(L,5)+
  '<p class="sgrp-t">'+escHtml(L.general)+'</p><div class="sgrp">'+
    row(ico("globe"),L.language,escHtml(langName),"lang")+
    row(ico("theme"),L.theme,escHtml(themeName(ST.theme)),"theme")+
  '</div>'+
  '<p class="sgrp-t">'+escHtml(L.budgetFor+" · "+getMonthLabel(ST.selectedMonth))+'</p><div class="sgrp">'+
    row(ico("cash"),L.monthlySalary,money(ST.income),"salary")+
    row(ico("cal"),L.fixedCats,escHtml(ST.fixedItems.length+" "+L.itemsN)+" · "+money(totalFixed()),"fixed")+
    row(ico("grid"),L.varCats,escHtml(ST.varItems.length+" "+L.catsN)+" · "+money(totalVarBudget()),"var")+
  '</div>'+
  '<p class="sgrp-t">'+escHtml(L.appSec)+'</p><div class="sgrp">'+
    '<div class="srow"><span class="srow-ic">'+ico("info")+'</span><span class="srow-l">BudgetPro</span><span class="srow-v">'+escHtml(L.version)+' 2.0</span></div>'+
  '</div>';
}

// ============ INIT ============
function init(){
  if(!ls("bdz",0)){if(ST.theme==="light"){ST.theme="sky";lsw("bt","sky");}lsw("bdz",1);}
  initMonths();
  document.addEventListener("click",e=>{
    if(ST.showMonthPicker&&e.target&&e.target.closest&&!e.target.closest("#month-wrap")){ST.showMonthPicker=false;renderMonthPicker();}
  });
  updateAll();
}

init();

if("serviceWorker" in navigator&&location.protocol==="https:"&&!AI_ON){
  window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});
}
</script>
