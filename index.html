<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BudgetPro">
<title>BudgetPro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"/>

<style>
:root {
  --bg:#0F172A;--surface:#131C31;--card:#1A2540;--card2:#1F2D4A;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#F8FAFC;--sub:#94A3B8;--sub2:#64748B;
  --gold:#F59E0B;--purple:#8B5CF6;--purple2:#A78BFA;
  --blue:#3B82F6;--green:#10B981;--red:#EF4444;
  --radius:16px;--radius-sm:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;}
body[lang="en"],body[lang="de"]{font-family:'Inter',sans-serif;}
input,select,button,textarea{font-family:inherit;}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
input:focus,select:focus{outline:none;border-color:var(--purple)!important;box-shadow:0 0 0 3px rgba(139,92,246,0.15);}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:rgba(139,92,246,0.3);border-radius:99px;}

/* Scroll container */
#scroll-area{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:90px;}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes toastIn{from{transform:translateX(-50%) translateY(-60px);opacity:0;}to{transform:translateX(-50%) translateY(0);opacity:1;}}
@keyframes toastOut{from{transform:translateX(-50%) translateY(0);opacity:1;}to{transform:translateX(-50%) translateY(-60px);opacity:0;}}
.fade-up{animation:fadeUp 0.25s cubic-bezier(0.34,1.3,0.64,1) both;}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:12px;}
.card-sm{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;}

/* Buttons */
.btn{border:none;border-radius:var(--radius-sm);padding:10px 16px;font-weight:700;cursor:pointer;color:#fff;font-size:13px;transition:opacity 0.15s,transform 0.1s;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
.btn:active{opacity:0.75;transform:scale(0.97);}
.btn-primary{background:linear-gradient(135deg,var(--purple),#6D28D9);}
.btn-gold{background:linear-gradient(135deg,var(--gold),#D97706);}
.btn-green{background:linear-gradient(135deg,var(--green),#059669);}
.btn-blue{background:linear-gradient(135deg,var(--blue),#1D4ED8);}
.btn-ghost{background:rgba(255,255,255,0.06);color:var(--sub);}
.btn-danger{background:rgba(239,68,68,0.12);color:#FCA5A5;border:1px solid rgba(239,68,68,0.2);}
.btn-sm{padding:6px 12px;font-size:11px;border-radius:8px;}
.btn-full{width:100%;padding:14px;font-size:15px;border-radius:14px;}

/* Inputs - STABLE: no re-render on input */
.inp{width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--border2);border-radius:12px;padding:12px 14px;color:var(--text);font-size:16px;/* 16px prevents iOS zoom */}
.inp::placeholder{color:var(--sub2);}
.lbl{font-size:11px;color:var(--sub);display:block;margin-bottom:6px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;}

/* Progress */
.prog{height:6px;background:rgba(255,255,255,0.06);border-radius:99px;overflow:hidden;margin-top:6px;}
.prog-fill{height:100%;border-radius:99px;transition:width 0.5s ease;}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:10px;font-weight:700;}
.badge-green{background:rgba(16,185,129,0.12);color:var(--green);border:1px solid rgba(16,185,129,0.2);}
.badge-red{background:rgba(239,68,68,0.12);color:var(--red);border:1px solid rgba(239,68,68,0.2);}
.badge-purple{background:rgba(139,92,246,0.12);color:var(--purple2);border:1px solid rgba(139,92,246,0.2);}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;}
.kpi{border-radius:16px;padding:14px 8px;text-align:center;}

/* BOTTOM NAV - Liquid Glass Style */
#bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;padding:0 12px 12px;}
.nav-glass{background:rgba(20,25,45,0.75);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid rgba(255,255,255,0.12);border-radius:24px;padding:8px 6px;display:flex;gap:2px;box-shadow:0 8px 32px rgba(0,0,0,0.4),0 0 0 0.5px rgba(255,255,255,0.08) inset;}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border:none;background:transparent;color:var(--sub2);cursor:pointer;border-radius:18px;transition:all 0.2s;position:relative;}
.nav-btn.active{background:rgba(139,92,246,0.15);color:var(--purple2);}
.nav-btn.active::before{content:'';position:absolute;top:0;left:10%;right:10%;height:2px;background:linear-gradient(90deg,transparent,var(--purple2),transparent);border-radius:99px;}
.nav-icon{font-size:20px;line-height:1;}
.nav-label{font-size:9px;font-weight:700;letter-spacing:0.3px;}

/* Header */
#app-header{background:rgba(15,23,42,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:12px 16px;}

/* Month btn */
.month-btn{width:100%;background:rgba(139,92,246,0.08);border:1px solid rgba(139,92,246,0.2);border-radius:12px;padding:9px 14px;color:var(--purple2);font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
.month-picker{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--border2);border-radius:16px;z-index:300;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.6);}
.month-item{width:100%;padding:12px 16px;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--sub);font-size:14px;cursor:pointer;text-align:inherit;display:flex;align-items:center;justify-content:space-between;transition:background 0.15s;}
.month-item.active,.month-item:active{background:rgba(139,92,246,0.1);color:var(--purple2);}

/* Section title */
.sec-title{font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.sec-icon{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}

/* Expense row */
.exp-row{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.exp-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}

/* Settings row */
.set-row{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:11px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}

/* Health ring */
.ring{width:72px;height:72px;position:relative;flex-shrink:0;}
.ring svg{transform:rotate(-90deg);}
.ring-val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;}

/* Toast */
#toast-el{position:fixed;top:16px;left:50%;z-index:9999;padding:10px 20px;border-radius:99px;font-size:13px;font-weight:700;color:#fff;white-space:nowrap;pointer-events:none;box-shadow:0 8px 32px rgba(0,0,0,0.4);}

/* Gradient text */
.grad{background:linear-gradient(135deg,var(--gold),var(--purple2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

/* Table */
.tbl{width:100%;border-collapse:collapse;font-size:12px;}
.tbl th{padding:8px 6px;color:var(--sub);font-weight:700;border-bottom:2px solid var(--border2);font-size:10px;text-transform:uppercase;letter-spacing:0.5px;text-align:inherit;}
.tbl td{padding:9px 6px;border-bottom:1px solid var(--border);}
.tbl tr:last-child td{border-bottom:none;}
.tbl-wrap{overflow-x:auto;}

/* Grid helpers */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;}
.flex-row{display:flex;align-items:center;gap:8px;}
.flex-between{display:flex;align-items:center;justify-content:space-between;}
.flex-col{display:flex;flex-direction:column;gap:8px;}

/* Themes */
body.light{--bg:#F0F4FF;--surface:#fff;--card:#fff;--card2:#F5F7FF;--border:rgba(0,0,0,0.07);--border2:rgba(0,0,0,0.12);--text:#0F172A;--sub:#64748B;--sub2:#94A3B8;}
body.light #bottom-nav .nav-glass{background:rgba(240,244,255,0.85);}
body.light #app-header{background:rgba(240,244,255,0.95);}
body.midnight{--bg:#06060F;--surface:#0D0D20;--card:#12122A;--card2:#171730;--border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.1);--text:#E0E0FF;--sub:#7777BB;--sub2:#555599;}
body.forest{--bg:#030F08;--surface:#071A0E;--card:#0C2415;--card2:#102D1A;--border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.1);--text:#E0FFE8;--sub:#6EBB88;--sub2:#4A8A62;}
body.ocean{--bg:#030C18;--surface:#071525;--card:#0C1E32;--card2:#101E38;--border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.1);--text:#E0F0FF;--sub:#6699CC;--sub2:#4477AA;}
body.rose{--bg:#100508;--surface:#1A0C10;--card:#261318;--card2:#2E1820;--border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.1);--text:#FFE0E8;--sub:#BB7788;--sub2:#905060;}
body.slate{--bg:#0D1117;--surface:#161B22;--card:#1C2128;--card2:#222830;--border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.1);--text:#E6EDF3;--sub:#8B949E;--sub2:#6E7681;}

@media print{#bottom-nav,#app-header{display:none!important;}}
</style>
</head>

<!-- Toast -->
<div id="toast-el"></div>

<!-- Header -->
<div id="app-header">
  <div style="max-width:680px;margin:0 auto;">
    <div class="flex-between" style="margin-bottom:10px;">
      <div class="flex-row">
        <div style="width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#8B5CF6,#6D28D9);display:flex;align-items:center;justify-content:center;font-size:18px;">💎</div>
        <div>
          <div class="grad" style="font-size:18px;font-weight:900;">BudgetPro</div>
          <div id="header-sub" style="font-size:10px;color:var(--sub);"></div>
        </div>
      </div>
      <div id="salary-pill" style="background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.25);border-radius:12px;padding:6px 14px;text-align:center;cursor:pointer;">
        <div style="font-size:9px;color:#6EE7B7;text-transform:uppercase;letter-spacing:1px;" id="salary-label"></div>
        <div id="salary-val" style="font-size:19px;font-weight:900;color:#10B981;"></div>
      </div>
    </div>
    <div style="position:relative;">
      <button class="month-btn" id="month-btn" onclick="toggleMonthPicker()">
        <span id="month-display"></span>
        <span style="color:var(--purple);font-size:12px;">▾</span>
      </button>
      <div class="month-picker" id="month-picker" style="display:none;position:absolute;"></div>
    </div>
  </div>
</div>

<!-- Scroll Area -->
<div id="scroll-area">
  <div style="max-width:680px;margin:0 auto;padding:14px 16px;">
    <div id="tab-content"></div>
  </div>
</div>

<!-- Bottom Nav - Liquid Glass -->
<div id="bottom-nav">
  <div class="nav-glass" id="nav-row"></div>
</div>

function ls(k,fb){try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch{return fb;}}
function lsw(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
function getMonthKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;}
function getMonthLabel(k){const[y,m]=k.split("-");return `${ST.L.months[parseInt(m)-1]} ${y}`;}

// Get display name for variable category
function getCatName(v){
  if(v.key && VAR_NAMES[v.key]) return VAR_NAMES[v.key][ST.lang]||VAR_NAMES[v.key].en;

}

};

// ============ COMPUTED ============
function expenses(){return ST.allData[ST.selectedMonth]||[];}
function totalFixed(){return ST.fixedItems.reduce((s,i)=>s+i.amount,0);}
function totalVarBudget(){return ST.varItems.reduce((s,i)=>s+i.budget,0);}
function totalSpent(){return expenses().reduce((s,e)=>s+e.amount,0);}
function remaining(){return totalVarBudget()-totalSpent();}
function spentCat(id){return expenses().filter(e=>e.catId===id).reduce((s,e)=>s+e.amount,0);}
function health(){return Math.max(0,Math.min(100,Math.round(((ST.income-totalFixed()-totalSpent())/ST.income)*100*1.5+55)));}
function allMonths(){return[...new Set([...Object.keys(ST.allData).filter(k=>(ST.allData[k]||[]).length>0),getMonthKey(now)])].sort((a,b)=>b.localeCompare(a));}

// ============ PERSIST ============
function saveConfig(){lsw("bi",ST.income);lsw("bf",ST.fixedItems);lsw("bv",ST.varItems);}
function saveData(){lsw("bd",ST.allData);}

// ============ TOAST ============
let toastTimer;
function toast(msg,color="#8B5CF6"){
  const el=document.getElementById("toast-el");
  el.textContent=msg;
  el.style.cssText=`position:fixed;top:16px;left:50%;z-index:9999;padding:10px 20px;border-radius:99px;font-size:13px;font-weight:700;color:#fff;white-space:nowrap;pointer-events:none;box-shadow:0 8px 32px rgba(0,0,0,0.4);background:${color};animation:toastIn 0.3s ease both;transform:translateX(-50%);`;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{el.style.animation="toastOut 0.3s ease both";setTimeout(()=>el.style.cssText="",300);},2500);
}

function addExpense(){
  const desc=document.getElementById("inp-desc")?.value?.trim()||"";
  const amount=parseFloat(document.getElementById("inp-amount")?.value||"0");
  const catId=parseInt(document.getElementById("inp-cat")?.value||ST.formCat);
  const date=document.getElementById("inp-date")?.value||ST.formDate;
  const L=ST.L;
  if(!desc){toast("⚠ "+L.descLabel,"#EF4444");return;}
  if(!amount||amount<=0){toast("⚠ "+L.amountLabel,"#EF4444");return;}
  const cat=ST.varItems.find(v=>v.id===catId)||ST.varItems[0];
  const entry={id:Date.now(),desc,amount,catId:cat.id,catKey:cat.key||"custom",date};
  if(!ST.allData[ST.selectedMonth])ST.allData[ST.selectedMonth]=[];
  ST.allData[ST.selectedMonth].unshift(entry);
  saveData();
  // Reset form
  const di=document.getElementById("inp-desc");if(di)di.value="";
  const ai=document.getElementById("inp-amount");if(ai)ai.value="";
  toast("✓ "+L.addExpense,"#10B981");
  setTab(0);
}

function deleteExpense(id){
  ST.allData[ST.selectedMonth]=(ST.allData[ST.selectedMonth]||[]).filter(e=>e.id!==id);
  saveData();
  renderTab();
  toast(ST.L.delete);
}

function saveIncome(){
  const val=parseFloat(document.getElementById("inp-income")?.value||ST.income);

async function generateReport(){
  ST.reportLoading=true;ST.reportText="";renderTab();
  const L=ST.L;
  const rows=ST.varItems.map(v=>`${getCatName(v)}: ${v.budget}€/${spentCat(v.id).toFixed(2)}€`).join(", ");
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1200,messages:[{role:"user",content:L.prompt(getMonthLabel(ST.selectedMonth),ST.income,totalFixed(),totalSpent().toFixed(2),remaining().toFixed(2),rows)}]})});
    const data=await res.json();
    ST.reportText=data.content?.map(i=>i.text||"").join("")||"Error";
  }catch{ST.reportText="Error. Try again.";}

// ============ HTML HELPERS ============
function h(tag,style,innerHTML){return `<${tag} style="${style}">${innerHTML}</${tag}>`;}
function div(style,innerHTML){return h("div",style,innerHTML);}
function p(style,text){return h("p",style,escHtml(text));}
function span(style,text){return h("span",style,escHtml(text));}
function escHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function badge(cls,text){return `<span class="badge ${cls}">${escHtml(text)}</span>`;}

// ============ UPDATE FUNCTIONS (no full re-render) ============
function updateAll(){
  document.body.className=ST.theme;

  updateNav();
  renderTab();
}

  const L=ST.L;

      <div class="nav-label">${L.tabs[i]}</div>

function renderMonthPicker(){
  const picker=document.getElementById("month-picker");
  if(!ST.showMonthPicker){picker.style.display="none";return;}
  const L=ST.L;
  picker.style.display="block";
  picker.innerHTML=allMonths().map(k=>`
    <button class="month-item ${k===ST.selectedMonth?"active":""}" onclick="setMonth('${k}')">
      <span>${getMonthLabel(k)}</span>
      ${k===getMonthKey(now)?`<span style="width:8px;height:8px;border-radius:50%;background:#10B981;display:inline-block;"></span>`:""}
    </button>
  `).join("");
}

// ============ TAB RENDERS ============
function renderTab(){
  const content=document.getElementById("tab-content");
  if(!content)return;
  // Scroll to top
  const sa=document.getElementById("scroll-area");if(sa)sa.scrollTop=0;

  const L=ST.L;
  let html="";
  if(ST.activeTab===0)html=renderDashboard(L);
  else if(ST.activeTab===1)html=renderAdd(L);
  else if(ST.activeTab===2)html=renderHistory(L);
  else if(ST.activeTab===3)html=renderAccounting(L);
  else if(ST.activeTab===4)html=renderReport(L);
  else if(ST.activeTab===5)html=renderSettings(L);
  content.innerHTML=html;
  content.className="fade-up";
  // Re-attach after innerHTML
  void content.offsetWidth;
}

function renderDashboard(L){
  const tf=totalFixed(),ts=totalSpent(),rem=remaining(),h2=health();
  const hColor=h2>=70?"#10B981":h2>=45?"#F59E0B":"#EF4444";
  const spentPct=Math.min(100,((tf+ts)/ST.income*100));

  let kpis=["fixed","spent","remaining"].map((k,i)=>{
    const vals=[tf,ts.toFixed(2),Math.abs(rem).toFixed(2)];
    const colors=["#F59E0B","#EF4444",rem>=0?"#10B981":"#EF4444"];
    const bgs=["rgba(245,158,11,0.1)","rgba(239,68,68,0.1)",rem>=0?"rgba(16,185,129,0.1)":"rgba(239,68,68,0.1)"];
    const icons=["📌","💸",rem>=0?"✦":"⚠"];
    const labels=[L.fixed,L.spent,L.remaining];
    return `<div class="kpi" style="background:${bgs[i]};border:1px solid ${colors[i]}25;">
      <div style="font-size:22px;margin-bottom:4px;">${icons[i]}</div>
      <div style="font-size:17px;font-weight:900;color:${colors[i]};">${vals[i]}€</div>
      <div style="font-size:9px;text-transform:uppercase;letter-spacing:0.8px;color:var(--sub);margin-top:2px;">${escHtml(labels[i])}</div>
    </div>`;
  }).join("");

  // SVG Ring
  const ringDash=(h2*0.942).toFixed(1);
  const ring=`<div class="ring">
    <svg viewBox="0 0 36 36" width="72" height="72">
      <circle cx="18" cy="18" r="15" fill="none" stroke="var(--border2)" stroke-width="3"/>
      <circle cx="18" cy="18" r="15" fill="none" stroke="${hColor}" stroke-width="3" stroke-dasharray="${ringDash} 94.2" stroke-linecap="round"/>
    </svg>
    <div class="ring-val" style="color:${hColor};">${h2}</div>
  </div>`;

  const hLabel=h2>=70?L.excellent:h2>=45?L.good:h2>=25?L.warning:L.critical;

  let varRows=ST.varItems.map(v=>{
    const s=spentCat(v.id),p2=Math.min((s/v.budget)*100,100),over=s>v.budget;
    const barColor=over?`linear-gradient(90deg,#EF4444,#DC2626)`:`linear-gradient(90deg,${v.color},${v.color}99)`;
    return `<div style="margin-bottom:16px;">
      <div class="flex-between" style="margin-bottom:6px;">
        <div class="flex-row"><span style="font-size:20px;">${v.icon}</span>
          <div><div style="font-size:13px;font-weight:700;">${escHtml(getCatName(v))}</div>
          <div style="font-size:11px;color:var(--sub);">${s.toFixed(2)}€ / ${v.budget}€</div></div>
        </div>
        ${over?badge("badge-red","⚠ "+L.overBy+" "+(s-v.budget).toFixed(2)+"€"):badge("badge-green","✓ "+L.leftOf+" "+(v.budget-s).toFixed(2)+"€")}
      </div>
      <div class="prog"><div class="prog-fill" style="width:${p2.toFixed(0)}%;background:${barColor};"></div></div>
    </div>`;
  }).join("");

  let fixedRows=ST.fixedItems.map(f=>`
    <div class="flex-between" style="padding:9px 0;border-bottom:1px solid var(--border);">
      <div class="flex-row"><div style="width:7px;height:7px;border-radius:50%;background:#F59E0B;"></div><span style="font-size:13px;">${escHtml(f.name)}</span></div>
      <span style="font-size:14px;font-weight:800;color:#F59E0B;">${f.amount}€</span>
    </div>`).join("");

  return `
  <div class="kpi-grid">${kpis}</div>
  <div class="grid2" style="margin-bottom:12px;">
    <div class="card" style="padding:16px;margin-bottom:0;">
      <div style="font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:10px;">${escHtml(L.health)}</div>
      <div class="flex-row">${ring}
        <div><div style="font-size:12px;font-weight:800;color:${hColor};margin-bottom:4px;">${escHtml(hLabel)}</div>
        <div style="font-size:11px;color:var(--sub);">${escHtml(L.savingsRate)}: ${Math.max(0,(rem/ST.income*100)).toFixed(1)}%</div></div>
      </div>
    </div>
    <div class="card" style="padding:16px;margin-bottom:0;">
      <div style="font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px;">${escHtml(L.expenseRate)}</div>
      <div style="font-size:26px;font-weight:900;color:${spentPct>90?"#EF4444":spentPct>70?"#F59E0B":"#10B981"};margin-bottom:8px;">${spentPct.toFixed(1)}%</div>
      <div class="prog"><div class="prog-fill" style="width:${spentPct}%;background:${spentPct>90?"linear-gradient(90deg,#EF4444,#DC2626)":spentPct>70?"linear-gradient(90deg,#F59E0B,#D97706)":"linear-gradient(90deg,#10B981,#059669)"};"></div></div>
      <div style="font-size:10px;color:var(--sub);margin-top:5px;">${tf+ts}€ / ${ST.income}€</div>
    </div>
  </div>
  <div class="card">
    <div class="sec-title"><div class="sec-icon" style="background:linear-gradient(135deg,#8B5CF6,#6D28D9);color:#fff;">∑</div>${escHtml(L.varBudgets)} — ${escHtml(getMonthLabel(ST.selectedMonth))}</div>
    ${varRows}
  </div>
  <div class="card">
    <div class="sec-title"><div class="sec-icon" style="background:linear-gradient(135deg,#F59E0B,#D97706);color:#fff;">📌</div>${escHtml(L.fixedExp)}</div>
    ${fixedRows}
    <div class="flex-between" style="padding-top:10px;margin-top:4px;">
      <span style="font-size:13px;font-weight:700;color:var(--sub);">${escHtml(L.total)}</span>
      <span style="font-size:16px;font-weight:900;color:#F59E0B;">${tf}€</span>
    </div>
  </div>`;
}

    </div>
    <div style="margin-bottom:14px;">
      <label class="lbl">${escHtml(L.catLabel)}</label>
      <select id="inp-cat" class="inp" style="background:var(--card2);">${catOptions}</select>
    </div>
    <div style="margin-bottom:20px;">
      <label class="lbl">${escHtml(L.dateLabel)}</label>
      <input id="inp-date" class="inp" type="date" value="${ST.formDate}"/>
    </div>
    <button class="btn btn-primary btn-full" onclick="addExpense()">${escHtml(L.addExpense)} →</button>
  </div>`;
}

function renderHistory(L){
  const exps=expenses();
  if(!exps.length)return `<div class="card" style="text-align:center;padding:48px 20px;">
    <div style="font-size:48px;margin-bottom:12px;">📭</div>
    <div style="font-size:14px;color:var(--sub);margin-bottom:16px;">${escHtml(L.noExpenses)}</div>
    <button class="btn btn-primary" onclick="setTab(1)">＋ ${escHtml(L.addFirst)}</button>
  </div>`;

  // Group by date
  const grouped={};
  exps.forEach(e=>{if(!grouped[e.date])grouped[e.date]=[];grouped[e.date].push(e);});
  let html=`<div class="flex-between" style="margin-bottom:14px;">
    <div style="font-size:15px;font-weight:800;">${escHtml(L.history||L.tabs[2])} — ${escHtml(getMonthLabel(ST.selectedMonth))}</div>
    ${badge("badge-purple",exps.length+" "+L.ops)}
  </div>`;
  Object.entries(grouped).sort((a,b)=>b[0].localeCompare(a[0])).forEach(([date,es])=>{
    html+=`<div style="font-size:11px;color:var(--sub);font-weight:700;letter-spacing:0.8px;text-transform:uppercase;margin:8px 2px 6px;">${date}</div>`;
    es.forEach(e=>{
      const cat=ST.varItems.find(v=>v.id===e.catId);
      const catName=getCatName(cat||{});
      const catColor=cat?.color||"#8B5CF6";
      const catIcon=cat?.icon||"💳";
      html+=`<div class="exp-row">
        <div class="exp-icon" style="background:${catColor}18;">${catIcon}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(e.desc)}</div>
          <div style="display:flex;gap:6px;margin-top:4px;align-items:center;flex-wrap:wrap;">
            <span style="font-size:10px;background:${catColor}18;color:${catColor};border:1px solid ${catColor}25;padding:2px 8px;border-radius:6px;font-weight:700;">${escHtml(catName)}</span>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
          <span style="font-size:15px;font-weight:900;color:#EF4444;">-${e.amount}€</span>
          <button class="btn btn-danger btn-sm" onclick="deleteExpense(${e.id})">✕</button>
        </div>
      </div>`;
    });
  });
  return html;
}

function renderAccounting(L){
  const exps=expenses();
  const entries=exps.map(e=>{const cat=ST.varItems.find(v=>v.id===e.catId);return{...e,catName:getCatName(cat||{}),soll:ACCOUNT_MAP[e.catKey||"custom"]||"6800",haben:"1200"};});
  let journalRows=entries.length?entries.map(e=>`<tr>
    <td style="color:var(--sub);white-space:nowrap;">${e.date}</td>
    <td style="max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(e.desc)}</td>
    <td style="color:#EF4444;font-weight:700;">${e.soll}</td>
    <td style="color:#10B981;font-weight:700;">${e.haben}</td>
    <td style="font-weight:700;">${e.amount.toFixed(2)}€</td>
  </tr>`).join(""):`<tr><td colspan="5" style="text-align:center;color:var(--sub);padding:20px;">${escHtml(L.noExpenses)}</td></tr>`;

  const tf=totalFixed(),ts=totalSpent();
  return `
  <div class="flex-row" style="margin-bottom:16px;">
    <div style="width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#10B981,#059669);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#fff;">∑</div>
    <div><div style="font-size:16px;font-weight:800;">${escHtml(L.tabs[3])}</div>
    <div style="font-size:11px;color:var(--sub);">${escHtml(getMonthLabel(ST.selectedMonth))}</div></div>
  </div>
  <div class="grid2" style="margin-bottom:12px;">
    <button class="btn btn-green" style="flex-direction:column;gap:4px;width:100%;padding:16px;border-radius:14px;" onclick="exportExcel()"><span style="font-size:22px;">📊</span>${escHtml(L.exportExcel)}</button>
    <button class="btn btn-blue" style="flex-direction:column;gap:4px;width:100%;padding:16px;border-radius:14px;" onclick="exportDATEV()"><span style="font-size:22px;">🏦</span>${escHtml(L.exportDATEV)}</button>
  </div>
  <div class="card" style="background:rgba(59,130,246,0.05);border-color:rgba(59,130,246,0.15);">
    <div style="font-size:13px;font-weight:800;color:#60A5FA;margin-bottom:6px;">ℹ️ DATEV & SAP</div>
    <div style="font-size:12px;color:var(--sub);line-height:1.7;">${escHtml(L.datevInfo)}</div>
  </div>
  <div class="card">
    <div class="sec-title">${escHtml(L.journal)}</div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr>
        <th>${escHtml(L.dateLabel)}</th><th>${escHtml(L.descLabel)}</th>
        <th>${escHtml(L.debit)}</th><th>${escHtml(L.credit)}</th><th>€</th>
      </tr></thead>
      <tbody>${journalRows}</tbody>
    </table></div>
  </div>
  <div class="card">
    <div class="sec-title">${escHtml(L.balance)}</div>
    <div class="grid2">
      <div style="background:rgba(16,185,129,0.07);border:1px solid rgba(16,185,129,0.2);border-radius:14px;padding:14px;">
        <div style="font-size:11px;font-weight:800;color:#10B981;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;">${escHtml(L.assets)}</div>
        ${[{l:L.salary+"",v:ST.income},{l:L.varBudgets,v:totalVarBudget()}].map(r=>`
        <div class="flex-between" style="padding:5px 0;border-bottom:1px solid rgba(16,185,129,0.1);">
          <span style="font-size:11px;color:var(--sub);">${escHtml(r.l)}</span>
          <span style="font-size:12px;font-weight:700;color:#10B981;">${r.v}€</span>
        </div>`).join("")}
        <div class="flex-between" style="padding-top:8px;"><span style="font-size:12px;font-weight:700;">${escHtml(L.total)}</span><span style="font-size:14px;font-weight:900;color:#10B981;">${ST.income+totalVarBudget()}€</span></div>
      </div>
      <div style="background:rgba(239,68,68,0.07);border:1px solid rgba(239,68,68,0.2);border-radius:14px;padding:14px;">
        <div style="font-size:11px;font-weight:800;color:#EF4444;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;">${escHtml(L.liabilities)}</div>
        ${[{l:L.fixedExp,v:tf},{l:L.spent,v:parseFloat(ts.toFixed(2))}].map(r=>`
        <div class="flex-between" style="padding:5px 0;border-bottom:1px solid rgba(239,68,68,0.1);">
          <span style="font-size:11px;color:var(--sub);">${escHtml(r.l)}</span>
          <span style="font-size:12px;font-weight:700;color:#EF4444;">${r.v}€</span>
        </div>`).join("")}
        <div class="flex-between" style="padding-top:8px;"><span style="font-size:12px;font-weight:700;">${escHtml(L.total)}</span><span style="font-size:14px;font-weight:900;color:#EF4444;">${(tf+ts).toFixed(0)}€</span></div>
      </div>
    </div>
  </div>`;
}

function renderReport(L){
  const gs=ST.gmailStatus;
  const gmailBtn=`<button class="btn" style="background:linear-gradient(135deg,#EA4335,#C62828);padding:10px 16px;border-radius:12px;flex-shrink:0;" onclick="sendGmail()">${escHtml(gs==="loading"?L.sending:gs==="success"?L.ok:gs==="error"?L.err:L.send)}</button>`;

  let analysisSection=!ST.reportText
    ?`<button class="btn btn-primary btn-full" onclick="generateReport()">✦ ${escHtml(L.generate)}</button>`
    :ST.reportLoading
    ?`<div style="text-align:center;padding:32px;color:var(--sub);"><div style="font-size:32px;margin-bottom:8px;">⏳</div><div>${escHtml(L.analyzing)}</div></div>`
    :`<div style="font-size:13px;line-height:1.9;color:var(--text);white-space:pre-wrap;background:var(--card2);border-radius:14px;padding:16px;">${escHtml(ST.reportText)}</div>`;

  const sumRows=[{l:L.salary,v:ST.income,c:"#10B981"},{l:L.fixedExp,v:totalFixed(),c:"#F59E0B"},{l:L.spent,v:totalSpent().toFixed(2),c:"#EF4444"},{l:L.remaining,v:remaining().toFixed(2),c:remaining()>=0?"#10B981":"#EF4444"}].map(r=>`
    <div style="background:var(--card2);border-radius:12px;padding:12px 14px;">
      <div style="font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:3px;">${escHtml(r.l)}</div>
      <div style="font-size:18px;font-weight:900;color:${r.c};">${r.v}€</div>
    </div>`).join("");

  const detailRows=ST.varItems.map(v=>{const s=spentCat(v.id),r=v.budget-s;return`<tr>
    <td>${v.icon} ${escHtml(getCatName(v))}</td>
    <td style="color:var(--sub);">${v.budget}€</td>
    <td style="color:#EF4444;font-weight:700;">${s.toFixed(2)}€</td>
    <td style="color:${r>=0?"#10B981":"#EF4444"};font-weight:700;">${r.toFixed(2)}€</td>
    <td style="font-size:11px;">${r>=0?L.within:L.exceeded}</td>
  </tr>`;}).join("");

  return `
  <div class="flex-between" style="margin-bottom:14px;">
    <div style="font-size:15px;font-weight:800;">${escHtml(L.report)}</div>
    <div class="flex-row">
      <button class="btn btn-ghost btn-sm" onclick="generateReport()">${escHtml(L.refresh)}</button>
      <button class="btn btn-primary btn-sm" onclick="window.print()">🖨 ${escHtml(L.pdf)}</button>
    </div>
  </div>
  <div class="card" style="background:rgba(234,67,53,0.05);border-color:rgba(234,67,53,0.15);">
    <div class="flex-between" style="gap:12px;">
      <div class="flex-row">
        <div style="width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#EA4335,#C62828);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;">✉️</div>
        <div><div style="font-size:13px;font-weight:700;color:#FCA5A5;">${escHtml(L.gmail)}</div>
        <div style="font-size:11px;color:var(--sub);">${escHtml(L.gmailDesc)}</div></div>
      </div>
      ${gmailBtn}
    </div>
    ${gs==="success"?`<div style="margin-top:10px;font-size:12px;color:#6EE7B7;">${escHtml(L.gmailDone)}</div>`:""}
    ${gs==="error"?`<div style="margin-top:10px;font-size:12px;color:#FCA5A5;">${escHtml(L.gmailFail)}</div>`:""}
  </div>
  <div class="card">
    <div class="sec-title">${escHtml(L.summary)}</div>
    <div class="grid2" style="margin-bottom:16px;">${sumRows}</div>
    <div class="sec-title">${escHtml(L.details)}</div>
    <div class="tbl-wrap" style="margin-bottom:16px;"><table class="tbl">
      <thead><tr>
        <th>${escHtml(L.catLabel)}</th><th>${escHtml(L.budget)}</th>
        <th>${escHtml(L.spent)}</th><th>${escHtml(L.remaining)}</th><th>${escHtml(L.status)}</th>
      </tr></thead>
      <tbody>${detailRows}</tbody>
    </table></div>
    <div class="sec-title">${escHtml(L.analysis)}</div>
    ${analysisSection}
  </div>`;
}

function renderSettings(L){
  const themeGrid=Object.keys(THEME_NAMES).map(key=>`
    <button onclick="setTheme('${key}')" style="padding:12px 6px;border-radius:14px;border:2px solid ${ST.theme===key?"var(--purple)":"transparent"};background:${THEME_BG[key]};cursor:pointer;position:relative;min-height:58px;width:100%;">
      <div style="width:18px;height:18px;border-radius:50%;background:${THEME_ACCENT[key]};margin:0 auto 4px;"></div>
      <div style="font-size:10px;color:#fff;font-weight:700;text-align:center;">${escHtml((THEME_NAMES[key]||{})[ST.lang]||THEME_NAMES[key].en)}</div>
      ${ST.theme===key?`<div style="position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--purple);"></div>`:""}
    </button>`).join("");

  const langGrid=[["ar","العربية","🇸🇦"],["en","English","🇬🇧"],["de","Deutsch","🇩🇪"]].map(([code,label,flag])=>`
    <button onclick="setLang('${code}')" style="padding:14px 6px;border-radius:14px;border:2px solid ${ST.lang===code?"var(--purple)":"var(--border2)"};background:${ST.lang===code?"rgba(139,92,246,0.12)":"var(--card2)"};cursor:pointer;width:100%;font-family:inherit;">
      <div style="font-size:24px;margin-bottom:4px;">${flag}</div>
      <div style="font-size:11px;font-weight:700;color:var(--text);">${label}</div>
      ${ST.lang===code?`<div style="font-size:9px;color:var(--purple2);margin-top:2px;">✓ Active</div>`:""}
    </button>`).join("");

  // Fixed items
  let fixedRows=ST.fixedItems.map(f=>{
    if(ST.editingFixed===f.id)return `
      <div class="card-sm flex-row">
        <input id="edf-name-${f.id}" class="inp" style="flex:2;padding:8px 10px;" value="${escHtml(f.name)}"/>
        <input id="edf-amt-${f.id}" class="inp" type="number" style="flex:1;padding:8px 10px;" value="${f.amount}"/>
        <button class="btn btn-green btn-sm" onclick="saveEditFixed(${f.id})">✓</button>
        <button class="btn btn-danger btn-sm" onclick="ST.editingFixed=null;renderTab()">✕</button>
      </div>`;
    return `<div class="set-row">
      <div class="flex-row"><div style="width:7px;height:7px;border-radius:50%;background:#F59E0B;"></div><span style="font-size:13px;">${escHtml(f.name)} <span style="color:#F59E0B;font-weight:700;">(${f.amount}€)</span></span></div>
      <div class="flex-row">
        <button class="btn btn-ghost btn-sm" onclick="ST.editingFixed=${f.id};renderTab()">✏</button>
        <button class="btn btn-danger btn-sm" onclick="delFixed(${f.id})">🗑</button>
      </div>
    </div>`;
  }).join("");

  // Variable items with icon/color editors
  let varRows=ST.varItems.map(v=>{
    if(ST.editingVar===v.id){
      const iconBtns=ICONS.map(ic=>`<button onclick="selectEditIcon(${v.id},'${ic}')" style="background:${v.icon===ic?"rgba(139,92,246,0.3)":"rgba(255,255,255,0.04)"};border:${v.icon===ic?"2px solid var(--purple)":"2px solid transparent"};border-radius:8px;padding:5px 7px;cursor:pointer;font-size:16px;">${ic}</button>`).join("");
      const colorBtns=COLORS.map(c=>`<button onclick="selectEditColor(${v.id},'${c}')" style="width:24px;height:24px;border-radius:50%;background:${c};border:${v.color===c?"3px solid #fff":"3px solid transparent"};cursor:pointer;"></button>`).join("");
      return `<div class="card-sm" style="flex-direction:column;gap:10px;">
        <div class="flex-row">
          <input id="edv-name-${v.id}" class="inp" style="flex:2;padding:8px 10px;" value="${escHtml(getCatName(v))}" placeholder="${escHtml(L.namePh)}"/>
          <input id="edv-budget-${v.id}" class="inp" type="number" style="flex:1;padding:8px 10px;" value="${v.budget}"/>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:5px;">${iconBtns}</div>
        <div style="display:flex;flex-wrap:wrap;gap:5px;">${colorBtns}</div>
        <div class="flex-row">
          <button class="btn btn-green" style="flex:1;padding:10px;" onclick="saveEditVar(${v.id})">✓ ${escHtml(L.save)}</button>
          <button class="btn btn-danger" style="padding:10px 14px;" onclick="ST.editingVar=null;renderTab()">${escHtml(L.cancel)}</button>
        </div>
      </div>`;
    }
    return `<div class="set-row">
      <div class="flex-row"><span style="font-size:20px;">${v.icon}</span>
        <div><div style="font-size:13px;font-weight:600;">${escHtml(getCatName(v))}</div>
        <div style="font-size:11px;color:${v.color};font-weight:700;">${v.budget}€</div></div>
      </div>
      <div class="flex-row">
        <button class="btn btn-ghost btn-sm" onclick="ST.editingVar=${v.id};renderTab()">✏</button>
        <button class="btn btn-danger btn-sm" onclick="delVar(${v.id})">🗑</button>
      </div>
    </div>`;
  }).join("");

  const iconBtnsNew=ICONS.map(ic=>`<button onclick="selectIcon('${ic}')" style="background:${ST.newVarIcon===ic?"rgba(139,92,246,0.3)":"rgba(255,255,255,0.04)"};border:${ST.newVarIcon===ic?"2px solid var(--purple)":"2px solid transparent"};border-radius:8px;padding:5px 7px;cursor:pointer;font-size:16px;">${ic}</button>`).join("");
  const colorBtnsNew=COLORS.map(c=>`<button onclick="selectColor('${c}')" style="width:24px;height:24px;border-radius:50%;background:${c};border:${ST.newVarColor===c?"3px solid #fff":"3px solid transparent"};cursor:pointer;"></button>`).join("");

  const incomeSection=ST.editIncome
    ?`<div class="flex-row" style="margin-top:12px;">
        <input id="inp-income" class="inp" type="number" inputmode="decimal" style="flex:1;" value="${ST.incomeInput}"/>
        <button class="btn btn-green" onclick="saveIncome()" style="padding:12px 16px;">${escHtml(L.save)}</button>
        <button class="btn btn-danger btn-sm" onclick="ST.editIncome=false;renderTab()">${escHtml(L.cancel)}</button>
      </div>`
    :`<div style="font-size:26px;font-weight:900;color:#10B981;margin-top:8px;">${ST.income}€</div>`;

  return `
  <div style="font-size:15px;font-weight:800;margin-bottom:16px;">⚙️ ${escHtml(L.tabs[5])}</div>

  <div class="card">
    <div style="font-size:12px;font-weight:800;color:#60A5FA;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:12px;">🌐 ${escHtml(L.language)}</div>
    <div class="grid3">${langGrid}</div>
  </div>

  <div class="card">
    <div style="font-size:12px;font-weight:800;color:#60A5FA;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:12px;">🎨 ${escHtml(L.theme)}</div>
    <div class="grid4">${themeGrid}</div>
  </div>

  <div class="card">
    <div class="flex-between">
      <div style="font-size:13px;font-weight:800;color:#F59E0B;">💵 ${escHtml(L.monthlySalary)}</div>
      <button class="btn ${ST.editIncome?"btn-danger":"btn-ghost"} btn-sm" onclick="ST.editIncome=${!ST.editIncome};renderTab()">${escHtml(ST.editIncome?L.cancel:L.edit)}</button>
    </div>
    ${incomeSection}
  </div>

  <div class="card">
    <div style="font-size:13px;font-weight:800;color:#F59E0B;margin-bottom:12px;">📌 ${escHtml(L.fixedCats)}</div>
    ${fixedRows}
    <div style="border-top:1px solid var(--border);padding-top:12px;margin-top:6px;">
      <label class="lbl">${escHtml(L.addFixed)}</label>
      <div class="flex-row" style="margin-top:8px;">
        <input id="inp-fn" class="inp" style="flex:2;" placeholder="${escHtml(L.namePh)}"/>
        <input id="inp-fa" class="inp" type="number" inputmode="decimal" style="flex:1;" placeholder="€"/>
        <button class="btn btn-primary btn-sm" onclick="addFixed()">${escHtml(L.add)}</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div style="font-size:13px;font-weight:800;color:var(--purple2);margin-bottom:12px;">📂 ${escHtml(L.varCats)}</div>
    ${varRows}
    <div style="border-top:1px solid var(--border);padding-top:12px;margin-top:6px;">
      <label class="lbl">${escHtml(L.addVar)}</label>
      <div class="flex-row" style="margin-top:8px;margin-bottom:10px;">
        <input id="inp-vn" class="inp" style="flex:2;" placeholder="${escHtml(L.namePh)}"/>
        <input id="inp-vb" class="inp" type="number" inputmode="decimal" style="flex:1;" placeholder="€"/>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;">${iconBtnsNew}</div>
      <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;">${colorBtnsNew}</div>
      <button class="btn btn-primary btn-full" onclick="addVar()">${escHtml(L.addVar)}</button>
    </div>
  </div>`;
}

// ============ INIT ============
function init(){
  document.body.className=ST.theme;
  document.body.setAttribute("lang",ST.lang);
  document.body.setAttribute("dir",ST.L.dir);
  updateHeader();
  updateNav();
  renderTab();
}

init();
</script>
</body>
</html>
